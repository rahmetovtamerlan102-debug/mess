<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Чат</title>
<style>
:root{--bg:#000;--panel:#1c1c1e;--in:#212124;--text:#f2f3f5;--muted:#8b909a;--out1:#9341d0;--out2:#4d68e6;--link:#3aa0ff;--accent:#ef5da8;--blue:#3aa0ff;--out-grad:linear-gradient(180deg,#9341d0 12%,#4d68e6 68%)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{background:#000;color:var(--text);font:15px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;justify-content:center;height:100dvh}
.screen{display:none;flex-direction:column;width:100%;max-width:480px;height:100%;position:relative;background:#000}
.screen.active{display:flex}
.chatbg{background:radial-gradient(60% 30% at 20% 25%,#000 0,transparent 70%),radial-gradient(55% 20% at 30% 55%,#4a4a4d 0,transparent 70%),radial-gradient(60% 24% at 60% 85%,#7d7d80 0,transparent 70%),#3a3a3c}
#profileScreen{position:fixed;inset:0;z-index:100;max-width:480px;margin:0 auto}
svg.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block}
.bar{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top,0px) + 6px) 10px 6px;flex-shrink:0;z-index:5;min-height:52px}
.bar h1{font-size:20px;font-weight:700;flex:1}
.pill{background:rgba(28,28,30,.92);border-radius:24px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);height:46px;display:flex;align-items:center;flex-shrink:0}
.btn{width:40px;height:40px;border:0;color:var(--text);cursor:pointer;background:none;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.btn:active{background:rgba(255,255,255,.08)}
.btn.bg{background:rgba(28,28,30,.92);width:46px;height:46px}
.who{flex:1;gap:8px;padding:0 12px 0 4px;min-width:0;cursor:pointer}
.who b{display:block;font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who small{color:var(--muted);font-size:12px;display:block}
.who small.online{color:#4dcd5e}
.acts{padding:0 2px;display:flex}
.ava{width:40px;height:40px;border-radius:50%;background:linear-gradient(180deg,#5fb0ff,#3a82d8);flex:none;display:grid;place-items:center;font-weight:700;font-size:15px;text-transform:uppercase;position:relative;background-size:cover;background-position:center;color:#fff}
.ava.sm{width:38px;height:38px}
.ava.xl{width:92px;height:92px;font-size:38px}
.ava .dot{position:absolute;bottom:0;right:0;width:11px;height:11px;border-radius:50%;background:#4dcd5e;border:2px solid #000}
.content{flex:1;overflow-y:auto;padding:0 10px 16px;min-height:0}
#list{flex:1;overflow-y:auto;padding:8px 12px;display:flex;flex-direction:column;gap:3px}
.msg{max-width:80%;padding:6px 10px 5px 11px;border-radius:16px;position:relative;overflow-wrap:anywhere;font-size:15px}
.msg.in{align-self:flex-start;background:var(--in);border-bottom-left-radius:5px}
.msg.out{align-self:flex-end;background:var(--out-grad);background-attachment:fixed;border-bottom-right-radius:5px;color:#fff}
.msg.tail{margin-bottom:5px}
.msg a{color:var(--link);text-decoration:underline;word-break:break-all}.msg.out a{color:#fff}
.fwd{color:var(--link);font-size:13px;margin-bottom:2px}.fwd b{display:block;font-weight:500}.msg.out .fwd{color:#fff}
.reply{background:rgba(255,255,255,.16);border-left:3px solid #fff;border-radius:8px;padding:4px 8px;margin:1px 0 5px;font-size:13px}.reply b{display:block}
.msg .txt{white-space:pre-wrap}
.meta{float:right;margin:7px -2px -2px 10px;font-size:11px;color:var(--muted);display:inline-flex;gap:3px;align-items:center;line-height:1}
.out .meta{color:rgba(255,255,255,.8)}
.meta svg{width:15px;height:15px;stroke-width:2.4;stroke:currentColor;fill:none;stroke-linecap:round;stroke-linejoin:round}
.msg img,.msg video{max-width:100%;border-radius:12px;display:block;margin-bottom:4px}
.msg audio{width:220px;max-width:100%}
.reactions{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}.reaction{background:rgba(255,255,255,.15);border-radius:10px;padding:2px 7px;font-size:12px}
.input{margin:4px 8px calc(env(safe-area-inset-bottom,0px) + 8px);gap:4px;padding:0 4px 0 14px;height:48px;flex-shrink:0}
.input textarea{flex:1;background:none;border:0;outline:0;color:var(--text);font:inherit;font-size:16px;min-width:0;resize:none;padding:13px 0;max-height:120px;line-height:1.3;caret-color:var(--accent)}
.input button{background:none;border:0;color:#9aa0aa;width:38px;height:38px;display:flex;align-items:center;justify-content:center;border-radius:50%;flex-shrink:0}
.send{background:var(--accent)!important;color:#fff!important;width:40px!important;height:40px!important}
.send.recording{background:#e53935!important;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.6}}
.strip-bar{background:rgba(28,28,30,.92);margin:0 8px 5px;padding:6px 12px;border-radius:14px;display:flex;gap:10px;align-items:center}
.strip{width:3px;background:var(--accent);height:26px;border-radius:2px}
.strip-bar .i{flex:1;min-width:0}.strip-bar .t{color:var(--accent);font-size:12px;font-weight:600}
.strip-bar .s{color:#ccc;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.strip-bar .x{color:var(--muted);padding:4px;cursor:pointer}
#loginScreen{justify-content:center;padding:28px}
#loginScreen .logo{text-align:center;font-size:56px;color:var(--accent);font-weight:700}
#loginScreen h1{text-align:center;color:var(--accent);margin:8px 0 32px;font-size:22px}
.field{width:100%;padding:14px 16px;border-radius:14px;border:1.5px solid transparent;background:var(--panel);color:#fff;font-size:16px;outline:none;margin-bottom:10px;display:block}
.field:focus{border-color:var(--accent)}
.btn-main{width:100%;padding:14px;border-radius:14px;border:0;background:var(--accent);color:#fff;font-size:15px;font-weight:600;margin-bottom:10px}
.btn-main.sec{background:var(--panel);color:var(--accent)}
.error{color:#f66;font-size:14px;text-align:center;min-height:20px}
.li{padding:8px 6px;display:flex;align-items:center;gap:12px;cursor:pointer;border-radius:12px}
.li:active{background:rgba(255,255,255,.05)}
.li .info{flex:1;min-width:0}.li .name{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .sub{color:var(--muted);font-size:13px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.li .sub.online{color:#4dcd5e}
.search{width:100%;padding:10px 14px;border-radius:12px;background:var(--panel);color:#fff;border:0;font-size:15px;outline:none;margin:6px 0}
.nav{display:flex;background:rgba(28,28,30,.96);margin:0 8px calc(8px + env(safe-area-inset-bottom,0px));border-radius:26px;padding:4px;flex-shrink:0;backdrop-filter:blur(14px)}
.ni{flex:1;padding:6px 2px 4px;text-align:center;color:#fff;cursor:pointer;font-size:11px;font-weight:600;border-radius:22px;position:relative}
.ni svg{margin:0 auto 2px;width:24px;height:24px;stroke-width:1.8}
.ni .navava{width:24px;height:24px;border-radius:50%;margin:0 auto 2px;background:linear-gradient(180deg,#5fb0ff,#3a82d8) center/cover;display:grid;place-items:center;font-size:12px;font-weight:700}
.ni.on{color:var(--accent);background:rgba(239,93,168,.14)}
.badge{position:absolute;top:1px;left:50%;margin-left:4px;background:var(--accent);color:#fff;border-radius:10px;min-width:18px;height:18px;padding:0 5px;font-size:11px;font-weight:700;display:none;align-items:center;justify-content:center}
.pact-row{display:flex;gap:8px;margin-top:14px}
.pact{flex:1;background:var(--panel);border-radius:16px;padding:14px 6px 12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;cursor:pointer;color:#fff;min-height:78px;text-align:center}
.pact:active{background:#2a2a2d}
.pact svg{width:24px;height:24px;fill:currentColor;stroke:none;display:block}
.pact span{font-size:12px;font-weight:600;line-height:1.15;display:block;max-width:100%}
.pcard{background:var(--panel);border-radius:16px;padding:12px 16px;margin-top:10px}
.pcard .v{font-size:16px;word-break:break-all}.pcard .l{color:var(--muted);font-size:13px;margin-top:2px}
.ptabs{display:flex;background:var(--panel);border-radius:22px;padding:4px;margin-top:12px;gap:2px;overflow-x:auto;scrollbar-width:none}
.ptabs::-webkit-scrollbar{display:none}
.ptab{padding:8px 14px;border-radius:18px;color:var(--muted);font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
.ptab.on{background:rgba(239,93,168,.2);color:var(--accent)}
.empty{text-align:center;padding:40px 20px 110px}.empty h3{font-size:20px;font-weight:700}.empty p{color:var(--muted);font-size:15px;margin-top:8px}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 82px);display:flex;align-items:center;gap:8px;padding:0 22px;height:44px;border:0;border-radius:22px;background:var(--accent);color:#fff;font-size:15px;font-weight:600;white-space:nowrap;box-shadow:0 0 0 4px rgba(0,0,0,.65);z-index:20}
.fab svg{width:20px;height:20px;fill:#fff}
.fab.hide{display:none}
.ggrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px 0 24px}
.gcard{background:var(--panel);border-radius:16px;padding:12px 4px 10px;text-align:center;cursor:pointer;position:relative;overflow:hidden}
.gcard:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 35%,rgba(239,93,168,.22),transparent 65%)}
.gem{font-size:42px;line-height:1.1;display:inline-block;position:relative;filter:drop-shadow(0 5px 6px rgba(0,0,0,.5));animation:gfloat 3s ease-in-out infinite}
.gcard:nth-child(2n) .gem{animation-delay:-.8s;animation-duration:3.4s}
.gcard:nth-child(3n) .gem{animation-delay:-1.6s;animation-duration:2.7s}
.gcard:nth-child(5n) .gem{animation-name:gspin}
@keyframes gfloat{0%,100%{transform:translateY(0) rotate(-6deg) scale(1)}50%{transform:translateY(-6px) rotate(6deg) scale(1.1)}}
@keyframes gspin{0%,100%{transform:rotate(-10deg) scale(1)}25%{transform:rotate(10deg) scale(1.12)}50%{transform:rotate(-6deg) scale(1)}75%{transform:rotate(8deg) scale(1.08)}}
.gcard .n{font-size:12px;font-weight:600;position:relative;margin-top:4px}.gcard .s{font-size:11px;color:#f5c451;margin-top:2px;position:relative}
.gcard.tap .gem{animation:gpop .6s}
@keyframes gpop{40%{transform:scale(1.5) rotate(15deg)}}
@media(prefers-reduced-motion:reduce){.gem{animation:none}}
.sc{background:var(--panel);border-radius:16px;margin-top:10px;overflow:hidden;padding:2px 0}
.si{display:flex;align-items:center;gap:14px;padding:8px 14px;cursor:pointer;position:relative}
.si:active{background:rgba(255,255,255,.05)}
.si+.si:before{content:"";position:absolute;top:0;left:58px;right:0;height:1px;background:rgba(255,255,255,.06)}
.si .ico{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex-shrink:0}
.si .ico svg{width:18px;height:18px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.si .t{font-size:16px}.si .d{color:var(--muted);font-size:13px;margin-top:1px}.si .r{margin-left:auto;color:#ec7ab8;font-size:15px}
.shead{text-align:center;padding:2px 0}.shead .nm{font-size:20px;font-weight:700;margin-top:8px}.shead .un{color:var(--muted);font-size:14px;margin-top:2px}
.sh{color:var(--accent);font-size:14px;font-weight:600;padding:10px 14px 4px}
.th{color:var(--accent);font-size:14px;font-weight:600;padding:12px 16px 2px}
.tr{display:flex;align-items:center;gap:14px;padding:0 16px;min-height:46px;font-size:16px;cursor:pointer;position:relative}
.tr:active{background:rgba(255,255,255,.05)}
.tr+.tr:before{content:"";position:absolute;top:0;left:16px;right:0;height:1px;background:rgba(255,255,255,.07)}
.tr.hi+.tr.hi:before{left:56px}
.tr .ti{width:24px;height:24px;fill:none;stroke:#9aa0aa;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.tr .tt{flex:1;min-width:0;display:flex;align-items:center;gap:6px}
.tr .tv{color:var(--accent);font-size:15px;white-space:nowrap}
.tr .st{width:18px;height:18px;flex-shrink:0}
.tn{color:var(--muted);font-size:13px;padding:8px 16px 2px;line-height:1.35}
.sw{width:40px;height:24px;border-radius:12px;background:#3a3a3d;position:relative;flex-shrink:0;transition:background .2s}
.sw:after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s}
.sw.on{background:var(--accent)}.sw.on:after{transform:translateX(16px)}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.88);color:#fff;padding:9px 18px;border-radius:18px;font-size:13px;z-index:700;opacity:0;transition:opacity .3s;pointer-events:none;max-width:90%;text-align:center}
.toast.show{opacity:1}
.ctx{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;background:#222;border-radius:18px 18px 0 0;padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px));z-index:650;transform:translateY(100%);transition:transform .25s}
.ctx.on{transform:none}
.ci{padding:12px 22px;display:flex;align-items:center;gap:14px;font-size:15px;cursor:pointer}.ci:active{background:rgba(255,255,255,.06)}
.ci.danger{color:#f66}.ci i{font-style:normal;width:24px;font-size:18px}
.back{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:640;display:none}.back.on{display:block}
.conn{position:fixed;top:0;left:0;right:0;text-align:center;padding:3px;font-size:11px;background:var(--accent);color:#fff;z-index:800;display:none}.conn.show{display:block}
.loading{position:fixed;inset:0;background:#000;z-index:900;display:none;align-items:center;justify-content:center;flex-direction:column;gap:20px;color:var(--accent);font-size:14px}.loading.show{display:flex}
.spinner{width:40px;height:40px;border:3px solid #333;border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.box{padding:12px 16px;background:var(--panel);margin-top:10px;border-radius:14px}.box label{color:var(--accent);font-size:12px;display:block;margin-bottom:4px}
.box input{width:100%;padding:6px 0;border:0;background:none;color:#fff;font-size:16px;outline:none}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="conn" id="conn"></div>
<div class="loading" id="loading"><div class="spinner"></div>Восстанавливаем сессию...</div>

<div class="screen active" id="loginScreen">
  <div class="logo">M</div><h1>Messenger</h1>
  <input class="field" id="u" placeholder="username" autocomplete="off" autocapitalize="off">
  <input class="field" id="p" placeholder="пароль" type="password">
  <button class="btn-main" onclick="doAuth('login')">Войти</button>
  <button class="btn-main sec" onclick="doAuth('register')">Создать аккаунт</button>
  <div class="error" id="err"></div>
</div>

<div class="screen" id="mainScreen">
  <header class="bar">
    <button class="btn hidden" id="mBack" onclick="switchTab('settings')"><svg class="ic" viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></button>
    <h1 id="title">Чаты</h1>
    <button class="btn" id="mMenu" onclick="mainMenu()"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="12" cy="19" r="1.4"/></svg></button>
  </header>
  <div class="content" id="main"></div>
  <button class="fab hide" id="fab"></button>
  <nav class="nav" id="nav">
    <div class="ni on" data-t="chats" onclick="switchTab('chats')"><svg class="ic" viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.7 7L4 20.5l1.5-4.6A8 8 0 1 1 21 12z"/></svg>Чаты<span class="badge" id="bdg"></span></div>
    <div class="ni" data-t="users" onclick="switchTab('users')"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="10" r="3.2"/><path d="M5.8 19c1.4-3 3.6-4 6.2-4s4.8 1 6.2 4"/></svg>Контакты</div>
    <div class="ni" data-t="settings" onclick="switchTab('settings')"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="7"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>Настройки</div>
    <div class="ni" data-t="profile" onclick="switchTab('profile')"><div class="navava" id="navAva">?</div>Профиль</div>
  </nav>
</div>

<div class="screen chatbg" id="chatScreen">
  <header class="bar">
    <button class="btn bg" onclick="closeChat()"><svg class="ic" viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></button>
    <div class="pill who" onclick="openProfile(cur)">
      <div class="ava sm" id="cAva">?</div>
      <div style="flex:1;min-width:0"><b id="cName">Чат</b><small id="cStat">был(а) недавно</small></div>
    </div>
    <div class="pill acts"><button class="btn" onclick="openChatMenu()"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="12" cy="19" r="1.4"/></svg></button></div>
  </header>
  <div id="pinned"></div>
  <main id="list"></main>
  <div id="rp"></div>
  <form class="pill input" onsubmit="event.preventDefault();sendOrMic()">
    <textarea id="mi" placeholder="Сообщение" rows="1" oninput="autoH(this);upd()" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendOrMic()}"></textarea>
    <button type="button" onclick="fileIn.click()"><svg class="ic" viewBox="0 0 24 24" style="width:24px;height:24px"><path d="M20 11l-8.5 8.5a5 5 0 0 1-7-7L13 4a3.5 3.5 0 0 1 5 5l-8.5 8.5a2 2 0 0 1-3-3L14 7"/></svg></button>
    <button type="submit" class="send" id="sb"></button>
  </form>
</div>

<div class="screen" id="profileScreen">
  <header class="bar">
    <button class="btn" onclick="closeProfile()"><svg class="ic" viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></button>
    <h1></h1>
  </header>
  <div class="content" id="pc"></div>
</div>

<div class="screen" id="editScreen">
  <header class="bar">
    <button class="btn" onclick="closeEdit()"><svg class="ic" viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></button>
    <h1>Изменить</h1>
    <button class="btn" onclick="saveProfile()" style="width:auto;padding:0 12px;color:var(--accent);font-weight:600;font-size:15px">Сохранить</button>
  </header>
  <div class="content">
    <div style="padding:18px;text-align:center;background:var(--panel);border-radius:16px;margin-top:6px">
      <div class="ava xl" id="eAva" style="margin:0 auto;cursor:pointer" onclick="avIn.click()">?</div>
      <div style="margin-top:10px;color:var(--accent);font-size:14px;cursor:pointer" onclick="avIn.click()">Выбрать фото</div>
    </div>
    <div class="box"><label>Ваше имя</label><input id="eName" maxlength="30" placeholder="Имя"></div>
    <div class="box"><label>О себе</label><input id="eBio" maxlength="70" placeholder="О себе"></div>
    <div class="box"><label>Имена пользователя</label><div id="eUn"></div>
      <div style="margin-top:10px;color:var(--accent);font-size:14px;font-weight:500;cursor:pointer" onclick="addUsername()">+ Добавить username</div></div>
  </div>
</div>

<!-- СКРИНЫ ПОДРАЗДЕЛОВ -->
<div class="screen" id="subScreen">
  <header class="bar">
    <button class="btn" onclick="closeSub()"><svg class="ic" viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></button>
    <h1 id="subTitle">Подраздел</h1>
  </header>
  <div class="content" id="subContent"></div>
</div>

<input type="file" id="avIn" class="hidden" accept="image/*" onchange="pickAvatar(event)">
<input type="file" id="fileIn" class="hidden" accept="image/*,video/*,audio/*" onchange="pickFile(event)">
<div class="back" id="back" onclick="closeCtx()"></div>
<div class="ctx" id="ctx"></div>
<div class="toast" id="toast"></div>

<script>
const WS_URL=location.origin.replace("https://","wss://").replace("http://","ws://")+"/ws";
const CHECK1='<svg viewBox="0 0 24 24"><path d="M5 12l5 5L20 7"/></svg>';
const CHECK2='<svg viewBox="0 0 24 24"><path d="M2 12l5 5L17 7M12 16l1 1L22 7"/></svg>';
const $=id=>document.getElementById(id), list=$('list'), fileIn=$('fileIn'), avIn=$('avIn');
let ws=null,me=null,meName=null,cur=null,curProf=null,users=[],tab='chats',chats={},avCache={},replyTo=null,editing=null,msgCache={};
let delay=1000,hb=null,token=localStorage.getItem("token"),pending=null,creds=null,booted=false,rec=false,mr=null,chunks=[],pTab='gifts',shown=null,shownBox=null;
let PRIV={}, DEVICES=[], BLACKLIST=[], EMAILS=[], CUR_SUB=null;
try{const s=localStorage.getItem("creds");if(s)creds=JSON.parse(s)}catch(e){}
const cleanU=s=>String(s||"").replace(/^@+/,"");
const esc=s=>String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const init=n=>n?String(n).replace(/^@+/,"").slice(0,1).toUpperCase():"?";
const iso=s=>s&&(s.endsWith("Z")||s.includes("+")?s:s+"Z");
const fmtTime=s=>{try{return new Date(iso(s)).toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"})}catch(e){return""}};
function lastSeen(s){
  if(!s)return"был(а) недавно";
  try{const d=new Date(iso(s)),n=new Date(),t=fmtTime(s);
    if((n-d)/1000<60)return"был(а) только что";
    if(d.toDateString()===n.toDateString())return"был(а) в "+t;
    const y=new Date(n);y.setDate(y.getDate()-1);
    if(d.toDateString()===y.toDateString())return"был(а) вчера в "+t;
    return"был(а) "+d.toLocaleDateString("ru-RU",{day:"2-digit",month:"2-digit"});
  }catch(e){return"был(а) недавно"}
}
const showScreen=id=>{document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));$(id).classList.add("active")};
const avStyle=f=>f&&avCache[f]?`background-image:url('${avCache[f]}');color:transparent`:"";

/* ═══ WS ═══ */
function connect(){
  ws=new WebSocket(WS_URL);
  ws.onopen=()=>{
    delay=1000;$('conn').classList.remove("show");
    if(pending)send(pending);
    else if(token)send({cmd:"resume",token});
    else if(creds&&creds.username&&creds.password){pending={cmd:"login",username:creds.username,password:creds.password};send(pending)}
    clearInterval(hb);hb=setInterval(()=>{if(ws&&ws.readyState===1)ws.send('{"cmd":"ping"}')},15000);
  };
  ws.onmessage=e=>{let d;try{d=JSON.parse(e.data)}catch{return}handle(d)};
  ws.onclose=()=>{clearInterval(hb);if(booted||me){$('conn').innerText="Переподключение...";$('conn').classList.add("show")}setTimeout(connect,delay);delay=Math.min(delay*2,30000)};
}
const send=o=>{if(ws&&ws.readyState===1)ws.send(JSON.stringify(o))};
function doAuth(cmd){
  const u=cleanU($('u').value),p=$('p').value;
  if(!u||!p)return $('err').innerText="Заполни всё";
  pending={cmd,username:u,password:p};creds={username:u,password:p};
  try{localStorage.setItem("creds",JSON.stringify(creds))}catch(e){}
  send(pending);
}
function handle(d){
  const t=d.type;
  if(t==="registered"||t==="logged_in"){
    me=d.user_id;meName=me;
    if(d.token){token=d.token;localStorage.setItem("token",token)}
    if(pending&&pending.username){creds={username:pending.username,password:pending.password};try{localStorage.setItem("creds",JSON.stringify(creds))}catch(e){}}
    pending=null;booted=true;$('loading').classList.remove("show");$('err').innerText="";$('conn').classList.remove("show");
    showScreen("mainScreen");send({cmd:"users"});send({cmd:"profile",user:me});switchTab("chats");
  }
  else if(t==="users"){users=d.list||[];if(tab==="users")renderUsers();if(tab==="chats")renderChats();if(tab==="gifts")renderShop()}
  else if(t==="user_online"||t==="user_offline"){const u=users.find(x=>x.u===d.user);if(u)u.online=t==="user_online";if(cur===d.user)chatStatus();if(tab==="users")renderUsers()}
  else if(t==="search_results"){$('csr')?renderCS(d.list||[]):renderFound(d.list||[])}
  else if(t==="contact_added"){toast("@"+d.user+" добавлен");send({cmd:"users"})}
  else if(t==="history")renderHistory(d.msgs);
  else if(t==="msg"){
    if(cur===d.from){addMessage(d,false);list.scrollTop=list.scrollHeight;send({cmd:"mark_read",with:d.from})}
    chats[d.from]={text:d.text||"[медиа]",ts:d.ts,unread:(chats[d.from]?.unread||0)+(cur===d.from?0:1)};badge();
  }
  else if(t==="sent"){if(cur===d.to){addMessage(d,true,d.delivered);list.scrollTop=list.scrollHeight}chats[d.to]={text:d.text||"[медиа]",ts:d.ts,unread:0}}
  else if(t==="msg_read")(d.ids||[]).forEach(id=>{const el=document.querySelector(`[data-mid="${id}"] .meta svg`);if(el)el.outerHTML=CHECK2});
  else if(t==="msg_edited"){const el=document.querySelector(`[data-mid="${d.msg_id}"] .txt`);if(el)el.innerText=d.text}
  else if(t==="msg_deleted"){const el=document.querySelector(`[data-mid="${d.msg_id}"]`);if(el)el.remove();markTails()}
  else if(t==="reactions_updated"){const el=document.querySelector(`[data-mid="${d.msg_id}"] .reactions`);if(el)el.innerHTML=d.reactions.map(r=>`<span class="reaction">${r.emoji} ${r.count}</span>`).join('')}
  else if(t==="msg_pinned")$('pinned').innerHTML=`<div class="strip-bar"><div class="strip"></div><div class="i"><div class="t">📌 от @${esc(d.from)}</div><div class="s">${esc((d.text||'').slice(0,60))}</div></div><div class="x" onclick="send({cmd:'unpin_msg',chat_with:cur})">✕</div></div>`;
  else if(t==="msg_unpinned")$('pinned').innerHTML="";
  else if(t==="profile"){
    if(d.avatar)loadAv(d.avatar);
    if(d.user===me){window._me=d;meName=d.first_name||me;navAvatar()}
    if(d.user===me&&tab==="profile"&&$('mainScreen').classList.contains("active"))renderProfile(d,$('main'));
    else if(d.user===me&&tab==="settings"&&$('mainScreen').classList.contains("active"))renderSettings();
    else if($('profileScreen').classList.contains("active")&&d.user===curProf)renderProfile(d,$('pc'));
  }
  else if(t==="avatar_data"){if(d.data){avCache[d.file]=d.data;refreshAv()}}
  else if(t==="profile_updated"){send({cmd:"profile",user:me});send({cmd:"users"})}
  else if(t==="username_added"){toast("@"+d.username+" добавлен");send({cmd:"profile",user:me});setTimeout(()=>renderUnEdit(window._me?.usernames),400)}
  else if(t==="username_deleted"){toast("@"+d.username+" удалён");send({cmd:"profile",user:me})}
  else if(t==="primary_updated"){toast("Основной: @"+d.username);send({cmd:"profile",user:me})}
  else if(t==="gift_received")toast(d.from+" подарил "+d.name+" "+d.stars+"★");
  else if(t==="gift_sent")toast("Подарок отправлен @"+d.to);
  else if(t==="chat_deleted"){delete chats[d.with];toast("Чат очищен")}
  // ─── PRIVACY ───
  else if(t==="privacy"){PRIV=d.data||{};if(CUR_SUB==="privacy")renderPrivacy()}
  else if(t==="privacy_updated"){PRIV[d.key]=d.value;if(CUR_SUB==="privacy")renderPrivacy();if(CUR_SUB===d.key)openSub(d.key);toast("Сохранено")}
  else if(t==="devices"){DEVICES=d.list||[];if(CUR_SUB==="devices")openSub("devices")}
  else if(t==="device_terminated"){DEVICES=DEVICES.filter(x=>x.id!==d.id);if(CUR_SUB==="devices")openSub("devices");toast("Сеанс завершён")}
  else if(t==="blacklist"){BLACKLIST=d.list||[];if(CUR_SUB==="bl")openSub("bl")}
  else if(t==="blacklist_added"){toast("Добавлен в ЧС");send({cmd:"get_blacklist"})}
  else if(t==="blacklist_removed"){toast("Удалён из ЧС");send({cmd:"get_blacklist"})}
  else if(t==="emails"){EMAILS=d.list||[];if(CUR_SUB==="mail")openSub("mail")}
  else if(t==="email_added"){toast("Email добавлен");send({cmd:"get_emails"})}
  else if(t==="email_verified"){toast("Email подтверждён");send({cmd:"get_emails"})}
  else if(t==="cloud_pw_set"){PRIV.cloud_pw=d.on?"on":"";if(CUR_SUB==="cloud")openSub("cloud");toast(d.on?"Облачный пароль включён":"Отключён")}
  else if(t==="passcode_set"){PRIV.passcode=d.on?"on":"";if(CUR_SUB==="pass")openSub("pass");toast(d.on?"Код-пароль включён":"Отключён")}
  else if(t==="passkey_added"){PRIV.passkey="on";if(CUR_SUB==="passkey")openSub("passkey");toast("Ключ добавлен")}
  else if(t==="passkey_removed"){PRIV.passkey="";if(CUR_SUB==="passkey")openSub("passkey");toast("Ключ удалён")}
  else if(t==="account_deleted"){toast("Аккаунт удалён");setTimeout(()=>logout(),800)}
  else if(t==="error"){
    if(d.msg==="session expired"){
      token=null;localStorage.removeItem("token");
      if(creds&&creds.username){pending={cmd:"login",username:creds.username,password:creds.password};send(pending);return}
      me=null;booted=false;$('loading').classList.remove("show");showScreen("loginScreen");$('err').innerText="Сессия истекла, войдите заново";return;
    }
    $('err').innerText=d.msg;if(me)toast("Ошибка: "+d.msg);
  }
}
function loadAv(f){if(f&&!avCache[f])send({cmd:"get_avatar",file:f})}
function navAvatar(){const p=window._me,el=$('navAva');if(!el)return;
  if(p&&p.avatar&&avCache[p.avatar]){el.style.backgroundImage=`url('${avCache[p.avatar]}')`;el.innerText=""}else{el.style.backgroundImage="";el.innerText=init(meName||me)}}
function refreshAv(){
  navAvatar();
  if(tab==="users")filterUsers($('us')?.value||"");
  if(tab==="chats")renderChats();
  if(tab==="settings")renderSettings();
  if(tab==="profile"&&window._me)renderProfile(window._me,$('main'));
  if(cur)chatHeadAv();
}
function badge(){const n=Object.values(chats).reduce((a,c)=>a+(c.unread||0),0),b=$('bdg');b.style.display=n?"flex":"none";b.innerText=n}

/* ═══ ВКЛАДКИ ═══ */
const TITLES={chats:"Чаты",users:"Контакты",settings:"Настройки",profile:"Профиль",gifts:"Подарки",privacy:"Конфиденциальность"};
function switchTab(t){
  tab=t;CUR_SUB=null;
  document.querySelectorAll(".ni").forEach(n=>n.classList.toggle("on",n.dataset.t===t||(t==="privacy"&&n.dataset.t==="settings")));
  $('title').innerText=TITLES[t];
  const sub=t==="gifts"||t==="privacy";
  $('mBack').classList.toggle("hidden",!sub);
  $('mMenu').classList.toggle("hidden",sub||t==="chats"||t==="users");
  $('fab').classList.add("hide");$('main').scrollTop=0;
  if(t==="chats")renderChats();
  else if(t==="users"){send({cmd:"users"});renderUsers()}
  else if(t==="gifts"){renderShop()}
  else if(t==="privacy"){send({cmd:"get_privacy"});renderPrivacy()}
  else if(t==="settings"){renderSettings();send({cmd:"profile",user:me})}
  else if(t==="profile"){window._me?renderProfile(window._me,$('main')):($('main').innerHTML="");send({cmd:"profile",user:me})}
  badge();
}
function mainMenu(){showCtx([{i:"✎",l:"Изменить профиль",a:"openEdit()"},{i:"⏻",l:"Выйти",d:1,a:"logout()"}])}

function renderChats(){
  const c=$('main');
  if(!$('chatsList'))c.innerHTML=`<input class="search" id="cs" placeholder="Поиск по @username" oninput="chatSearch(this.value)" autocomplete="off" autocapitalize="off"><div id="csr"></div><div id="chatsList"></div>`;
  const L=$('chatsList');L.innerHTML="";
  const keys=Object.keys(chats);
  if(!keys.length){L.innerHTML='<div class="empty" style="padding:50px 20px"><p style="font-size:15px">Нет диалогов<br>Найди человека по @username</p></div>';return}
  for(const u of keys){const ch=chats[u];L.appendChild(userItem(u,ch.text,ch.ts,ch.unread))}
}
function chatSearch(q){
  q=(q||"").trim().toLowerCase().replace(/^@+/,"");
  if(q.length<2){$('csr').innerHTML="";$('chatsList').style.display="";return}
  $('chatsList').style.display="none";send({cmd:"search_users",q});
}
function foundRow(x,fn){const el=document.createElement("div");el.className="li";el.onclick=fn;el.innerHTML=`<div class="ava">${init(x.u)}</div><div class="info"><div class="name">${esc(x.n||x.u)}</div><div class="sub">@${esc(x.u)}</div></div>`;return el}
function renderCS(l){const R=$('csr');l=l.filter(x=>x.u!==me);R.innerHTML=l.length?"":'<div style="padding:20px;text-align:center;color:var(--muted)">Никого не найдено</div>';l.forEach(x=>R.appendChild(foundRow(x,()=>openChat(x.u))))}
function renderFound(l){const R=$('fr');if(!R)return;l=l.filter(x=>x.u!==me);R.innerHTML=l.length?"":'<div style="padding:20px;text-align:center;color:var(--muted)">Никого не найдено</div>';l.forEach(x=>R.appendChild(foundRow(x,()=>send({cmd:"add_contact",user:x.u}))))}
function renderUsers(){
  $('main').innerHTML=`<input class="search" id="us" placeholder="Поиск в контактах" oninput="filterUsers(this.value)" autocomplete="off">
  <input class="search" placeholder="Добавить по @username" oninput="addSearch(this.value)" autocomplete="off" autocapitalize="off" style="margin-top:0"><div id="fr"></div><div id="ul"></div>`;
  filterUsers("");
}
function addSearch(q){q=(q||"").trim().toLowerCase().replace(/^@+/,"");if(q.length<2){$('fr').innerHTML="";return}send({cmd:"search_users",q})}
function filterUsers(q){
  const w=$('ul');if(!w)return;q=(q||"").toLowerCase().trim().replace(/^@+/,"");
  const l=users.filter(x=>x.u!==me&&(!q||x.u.includes(q)||(x.n||'').toLowerCase().includes(q)));
  if(!l.length){w.innerHTML='<div style="padding:30px;text-align:center;color:var(--muted)">Никого не найдено</div>';return}
  w.innerHTML="";
  l.forEach(x=>{const el=document.createElement("div");el.className="li";el.onclick=()=>openChat(x.u);
    el.innerHTML=`<div class="ava" style="${avStyle(x.av)}">${avCache[x.av]?'':init(x.n||x.u)}${x.online?'<i class="dot"></i>':''}</div><div class="info"><div class="name">${esc(x.n||x.u)}</div><div class="sub ${x.online?'online':''}">${x.online?'в сети':lastSeen(x.ls)}</div></div>`;
    w.appendChild(el);loadAv(x.av)});
}
function userItem(u,sub,ts,unread){
  const el=document.createElement("div");el.className="li";el.onclick=()=>openChat(u);
  const usr=users.find(x=>x.u===u),av=usr?usr.av:"";loadAv(av);
  const bd=unread?`<div style="background:var(--accent);color:#fff;border-radius:10px;min-width:20px;height:20px;padding:0 6px;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center">${unread}</div>`:"";
  el.innerHTML=`<div class="ava" style="${avStyle(av)}">${avCache[av]?'':init(u)}${usr&&usr.online?'<i class="dot"></i>':''}</div><div class="info"><div class="name">${esc(usr?.n||u)}</div><div class="sub">${esc(sub||"")}</div></div><div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px"><div style="color:var(--muted);font-size:11px">${ts?fmtTime(ts):""}</div>${bd}</div>`;
  return el;
}

/* ═══ ЧАТ ═══ */
function chatStatus(){const usr=users.find(x=>x.u===cur),st=$('cStat');if(usr&&usr.online){st.innerText="в сети";st.classList.add("online")}else{st.innerText=usr?lastSeen(usr.ls):"был(а) недавно";st.classList.remove("online")}}
function chatHeadAv(){const usr=users.find(x=>x.u===cur),av=usr?usr.av:"",el=$('cAva');
  if(av&&avCache[av]){el.style.backgroundImage=`url('${avCache[av]}')`;el.innerText=""}else{el.style.backgroundImage="";el.innerText=init(cur);loadAv(av)}}
function openChat(u){
  u=cleanU(u);cur=u;replyTo=null;editing=null;clearReply();
  if(chats[u])chats[u].unread=0;badge();
  $('cName').innerText=u;chatHeadAv();list.innerHTML="";$('pinned').innerHTML="";
  showScreen("chatScreen");chatStatus();upd();
  send({cmd:"history",with:u,limit:100});send({cmd:"get_pinned",chat_with:u});send({cmd:"mark_read",with:u});
  setTimeout(()=>list.scrollTop=list.scrollHeight,300);
}
function closeChat(){cur=null;replyTo=null;editing=null;showScreen("mainScreen");switchTab(tab==="gifts"||tab==="privacy"?"chats":tab)}
function sendMsg(){
  const inp=$('mi'),text=inp.value.trim();if(!text||!cur)return;
  if(editing){send({cmd:"edit_msg",msg_id:editing,text});editing=null}
  else{const p={cmd:"send",to:cur,text};if(replyTo)p.reply_to=replyTo;send(p);clearReply()}
  inp.value="";inp.style.height="auto";upd();
}
function markTails(){const ms=[...list.querySelectorAll(".msg")];ms.forEach((m,i)=>{const n=ms[i+1];m.classList.toggle("tail",!(n&&n.classList.contains("out")===m.classList.contains("out")))})}
function addMessage(d,isMe,delivered){
  const el=document.createElement("div");el.className="msg "+(isMe?"out":"in");el.dataset.mid=d.id;
  let h="";
  if(d.forwarded_from)h+=`<div class="fwd">Переслано от<b>${esc(d.forwarded_from)}</b></div>`;
  if(d.reply_to&&msgCache[d.reply_to]){const o=msgCache[d.reply_to];h+=`<div class="reply"><b>${esc(o.from)}</b>${esc((o.text||'').slice(0,60))}</div>`}
  if(d.media_url){
    if(d.media_type==="image")h+=`<img src="${d.media_url}" onclick="window.open(this.src,'_blank')">`;
    else if(d.media_type==="video")h+=`<video src="${d.media_url}" controls></video>`;
    else if(d.media_type==="audio")h+=`<audio src="${d.media_url}" controls></audio>`;
    else h+=`<a href="${d.media_url}" target="_blank">📎 файл</a>`;
  }
  h+=`<span class="txt">${esc(d.text||'').replace(/(https?:\/\/[^\s]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>')}</span>`;
  h+=`<span class="meta">${fmtTime(d.ts)}${isMe?(d.read||delivered?CHECK2:CHECK1):''}</span>`;
  if(d.reactions&&d.reactions.length)h+=`<div class="reactions">${d.reactions.map(r=>`<span class="reaction">${r.emoji} ${r.count}</span>`).join('')}</div>`;
  el.innerHTML=h;
  let pt;
  el.addEventListener("touchstart",()=>{pt=setTimeout(()=>msgMenu(d,isMe),500)});
  ["touchend","touchmove"].forEach(ev=>el.addEventListener(ev,()=>clearTimeout(pt)));
  el.addEventListener("contextmenu",e=>{e.preventDefault();msgMenu(d,isMe)});
  list.appendChild(el);msgCache[d.id]=d;markTails();
}
function renderHistory(msgs){list.innerHTML="";msgCache={};for(const m of msgs||[])addMessage(m,m.from===me,true);setTimeout(()=>list.scrollTop=list.scrollHeight,50)}
function autoH(el){el.style.height="auto";el.style.height=Math.min(el.scrollHeight,120)+"px"}
function msgMenu(d,isMe){
  const it=[{i:"❤️",l:"❤️",a:`reactTo(${d.id},'❤️')`},{i:"👍",l:"👍",a:`reactTo(${d.id},'👍')`},{i:"😂",l:"😂",a:`reactTo(${d.id},'😂')`},
    {i:"↩",l:"Ответить",a:`setReply(${d.id})`},{i:"➡",l:"Переслать",a:`fwdMsg(${d.id})`},{i:"📌",l:"Закрепить",a:`send({cmd:'pin_msg',msg_id:${d.id},chat_with:cur})`}];
  if(isMe){it.push({i:"✎",l:"Изменить",a:`editMsg(${d.id})`});it.push({i:"✕",l:"Удалить",d:1,a:`delMsg(${d.id})`})}
  showCtx(it);
}
const reactTo=(m,e)=>cur&&send({cmd:"react",msg_id:m,emoji:e,chat_with:cur});
function setReply(id){const m=msgCache[id];if(!m)return;replyTo=id;
  $('rp').innerHTML=`<div class="strip-bar"><div class="strip"></div><div class="i"><div class="t">Ответ ${esc(m.from===me?"вы":m.from)}</div><div class="s">${esc((m.text||'[медиа]').slice(0,50))}</div></div><div class="x" onclick="clearReply()">✕</div></div>`}
function clearReply(){replyTo=null;$('rp').innerHTML=""}
function fwdMsg(id){
  const m=msgCache[id];if(!m)return;const t=users.filter(x=>x.u!==me);if(!t.length)return toast("Нет других юзеров");
  const i=parseInt(prompt("Кому переслать?\n\n"+t.map((x,i)=>(i+1)+". @"+x.u).join("\n")+"\n\nНомер:"))-1;
  if(isNaN(i)||!t[i])return;
  send({cmd:"send",to:t[i].u,text:m.text,forwarded_from:m.from,media_url:m.media_url,media_type:m.media_type});toast("Переслано @"+t[i].u);
}
function editMsg(id){const m=msgCache[id];if(!m)return;editing=id;$('mi').value=m.text||"";$('mi').focus();upd()}
function delMsg(id){if(confirm("Удалить?"))send({cmd:"delete_msg",msg_id:id,for_all:true})}
function openChatMenu(){showCtx([{i:"◯",l:"Профиль",a:`openProfile('${cur}')`},{i:"✕",l:"Очистить чат",d:1,a:"clearChat()"}])}
function clearChat(){if(cur&&confirm("Удалить все сообщения?")){send({cmd:"delete_chat",with:cur});list.innerHTML=""}}
function pickFile(e){
  const f=e.target.files[0];if(!f)return;if(f.size>15*1024*1024)return toast("Файл >15 МБ");
  const mt=f.type.startsWith("image/")?"image":f.type.startsWith("video/")?"video":f.type.startsWith("audio/")?"audio":"file";
  const r=new FileReader();r.onload=x=>send({cmd:"send",to:cur,text:"",media_data:x.target.result,media_type:mt});r.readAsDataURL(f);e.target.value="";
}

function logout(){
  if(!confirm("Выйти?"))return;
  me=null;cur=null;curProf=null;chats={};avCache={};token=null;creds=null;pending=null;booted=false;window._me=null;
  localStorage.removeItem("token");localStorage.removeItem("creds");
  $('fab').classList.add("hide");$('u').value="";$('p').value="";$('err').innerText="";showScreen("loginScreen");
}

/* ═══ РЕДАКТОР ═══ */
function openEdit(){
  const p=window._me||{};
  $('eName').value=(p.first_name||"").replace(/^@+/,"");$('eBio').value=p.bio||"";
  const a=$('eAva');
  if(p.avatar&&avCache[p.avatar]){a.style.backgroundImage=`url('${avCache[p.avatar]}')`;a.innerText=""}else{a.style.backgroundImage="";a.innerText=init(p.first_name||me)}
  renderUnEdit(p.usernames);$('fab').classList.add("hide");showScreen("editScreen");
}
function renderUnEdit(l){
  const c=$('eUn');if(!c)return;const it=(l&&l.length)?l:[{u:me,primary:true}];
  c.innerHTML=it.map(x=>`<div style="padding:8px 0;border-bottom:1px solid rgba(255,255,255,.06)"><span style="color:var(--accent);font-size:15px">@${esc(cleanU(x.u))}</span>${x.primary?' <span style="color:var(--muted);font-size:12px">(основной)</span>':''}</div>`).join('');
}
function closeEdit(){showScreen("mainScreen");switchTab(tab)}
function addUsername(){
  const n=cleanU(prompt("Новый username (без @):")||"");if(!n)return;
  if(n.length<4)return toast("Минимум 4 символа");if(!/^[a-z0-9_]+$/.test(n))return toast("Только a-z, 0-9, _");
  send({cmd:"add_username",username:n});
}
function pickAvatar(e){
  const f=e.target.files[0];if(!f)return;if(f.size>5*1024*1024)return toast("Файл >5 МБ");
  const r=new FileReader();
  r.onload=x=>{const url=x.target.result,img=new Image();
    img.onload=()=>{try{const c=document.createElement("canvas"),m=512;let w=img.width,h=img.height;
      if(w>h){h=Math.round(h*m/w);w=m}else{w=Math.round(w*m/h);h=m}
      c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);saveAv(c.toDataURL("image/jpeg",.85))}catch(er){saveAv(url)}};
    img.onerror=()=>saveAv(url);img.src=url};
  r.readAsDataURL(f);e.target.value="";
}
function saveAv(data){send({cmd:"update_profile",avatar_data:data});toast("Фото сохраняется...")}
function saveProfile(){
  send({cmd:"update_profile",first_name:$('eName').value.trim().replace(/^@+/,""),bio:$('eBio').value.trim()});
  closeEdit();toast("Профиль сохранён");setTimeout(()=>{send({cmd:"profile",user:me});send({cmd:"users"})},500);
}

function showCtx(items){
  $('ctx').innerHTML=items.map(it=>`<div class="ci ${it.d?'danger':''}" onclick="closeCtx();${it.a}"><i>${it.i}</i><span>${it.l}</span></div>`).join('');
  $('back').classList.add("on");setTimeout(()=>$('ctx').classList.add("on"),10);
}
function closeCtx(){$('ctx').classList.remove("on");$('back').classList.remove("on")}
let tt;function toast(m){const t=$('toast');t.innerText=m;t.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("show"),2000)}

/* ─ Подписка на приходящие данные для подразделов ─ */
const _origHandle = handle;
handle = function(d){
  _origHandle(d);
  if(d.type==="devices" && CUR_SUB==="devices") renderDevices();
  if(d.type==="blacklist" && CUR_SUB==="bl") renderBlacklist();
  if(d.type==="emails" && CUR_SUB==="mail") renderEmails();
  if(d.type==="blacklist_added") send({cmd:"get_blacklist"});
  if(d.type==="blacklist_removed") send({cmd:"get_blacklist"});
  if(d.type==="email_added") send({cmd:"get_emails"});
  if(d.type==="email_verified") send({cmd:"get_emails"});
};

if(creds&&creds.username&&creds.password)$('loading').classList.add("show");
upd();connect();
