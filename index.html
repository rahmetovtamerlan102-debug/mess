<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Messenger</title>
<style>
:root{
  --bg:#0f1115;
  --panel:rgba(30,33,40,.92);
  --in:#1f2229;
  --text:#f2f3f5;
  --muted:#8b909a;
  --out1:#8a3fd0;
  --out2:#4f64e0;
  --link:#4aa8ff;
  --accent:#2aa3f2;
  --online:#4dcd5e;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{
  background:var(--bg);color:var(--text);
  font:16px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  display:flex;justify-content:center;
  height:100dvh;
}
.screen{display:none;flex-direction:column;width:100%;max-width:480px;height:100%;position:relative;overflow:hidden}
.screen.active{display:flex}

/* ═══ ОБЩИЙ ФОН-ПАТТЕРН ═══ */
.app-bg{
  position:absolute;inset:0;z-index:0;
  background:
    radial-gradient(60% 40% at 30% 35%, #3a3a40 0, transparent 70%),
    radial-gradient(50% 40% at 70% 80%, #242428 0, transparent 70%),
    radial-gradient(40% 30% at 15% 85%, #2a2a30 0, transparent 65%),
    #111;
}
.app-bg::after{
  content:"";position:absolute;inset:0;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160' viewBox='0 0 160 160'><g fill='none' stroke='%233a3a42' stroke-width='1.1' stroke-linecap='round' opacity='0.4'><path d='M20 30 q10 -8 20 0'/><circle cx='100' cy='30' r='3'/><path d='M40 80 l4 -4 l4 4 l-4 4z'/><path d='M100 90 q8 -6 16 0 q8 6 16 0'/><circle cx='30' cy='110' r='2.5'/><path d='M70 110 h10'/><path d='M110 120 q6 -5 12 0'/><circle cx='60' cy='50' r='2'/><path d='M75 20 l3 3 l3 -3'/><path d='M10 60 q5 -4 10 0 q5 4 10 0'/><circle cx='120' cy='60' r='2'/></g></svg>");
  background-size:160px 160px;
  opacity:.7;
}
.screen > *:not(.app-bg){position:relative;z-index:1}

/* ═══ LOGIN ═══ */
#loginScreen{justify-content:center;padding:28px}
#loginScreen .logo{text-align:center;font-size:56px;margin-bottom:12px;color:#8774e1;font-weight:700}
#loginScreen h1{text-align:center;color:#8774e1;margin-bottom:32px;font-size:22px;font-weight:600}
.field input{width:100%;padding:15px 16px;border-radius:14px;border:1.5px solid transparent;background:rgba(30,33,40,.92);color:#fff;font-size:16px;outline:none;margin-bottom:10px}
.field input:focus{border-color:#8774e1}
.btn{width:100%;padding:15px;border-radius:14px;border:none;background:linear-gradient(135deg,#8a3fd0,#4f64e0);color:#fff;font-size:15px;font-weight:600;cursor:pointer;margin-bottom:10px}
.btn.secondary{background:rgba(30,33,40,.92);color:#8774e1}
.error{color:#f66;font-size:14px;text-align:center;min-height:20px}

/* ═══ ШАПКА — PILL ═══ */
.bar{
  display:flex;align-items:center;gap:10px;
  padding:calc(env(safe-area-inset-top,0px) + 8px) 12px 8px;
  flex-shrink:0;
}
.pill{
  background:var(--panel);
  border-radius:28px;
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  height:56px;
  display:flex;align-items:center;
}
.pill.full{width:100%;padding:0 6px}
.btn{
  width:56px;height:56px;justify-content:center;
  background:none;border:0;color:var(--text);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  border-radius:50%;
  transition:background .15s;
}
.btn:active{background:rgba(255,255,255,.06)}
.btn.accent{color:var(--accent)}
.who{flex:1;gap:10px;padding:0 14px 0 6px;min-width:0;display:flex;align-items:center;cursor:pointer}
.ava{
  width:44px;height:44px;border-radius:50%;
  background:#222 center/cover;
  flex:none;display:grid;place-items:center;font-weight:700;
  position:relative;overflow:hidden;
  background-size:cover;background-position:center;
}
.ava.sm{width:38px;height:38px;font-size:14px}
.ava.lg{width:110px;height:110px;font-size:42px}
.ava .online-dot{
  position:absolute;bottom:1px;right:1px;
  width:12px;height:12px;border-radius:50%;
  background:var(--online);border:2px solid var(--panel);
}
.who b{display:block;font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who small{color:var(--muted);font-size:13px;display:block;margin-top:1px}
.who small.online{color:var(--online)}
.acts{display:flex;gap:6px;padding:0 10px}
.acts button{background:none;border:0;color:var(--text);width:40px;height:40px;cursor:pointer;display:flex;align-items:center;justify-content:center;border-radius:50%}
.acts button:active{background:rgba(255,255,255,.06)}

svg.ic{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block}

/* ═══ СООБЩЕНИЯ ═══ */
#list{
  flex:1;overflow-y:auto;padding:8px 10px;
  display:flex;flex-direction:column;gap:5px;
}
.msg{
  max-width:78%;padding:7px 10px 6px 12px;
  border-radius:18px;position:relative;
  word-wrap:break-word;overflow-wrap:anywhere;
  font-size:15.5px;line-height:1.35;
  box-shadow:0 1px 2px rgba(0,0,0,.25);
}
.msg.in{align-self:flex-start;background:var(--in);border-bottom-left-radius:5px}
.msg.out{
  align-self:flex-end;
  background:linear-gradient(135deg,var(--out1),var(--out2));
  border-bottom-right-radius:5px;
}
.msg .fwd{
  background:rgba(0,0,0,.2);border-radius:8px;
  padding:4px 8px;margin-bottom:4px;font-size:12.5px;
  color:#dcd;
}
.msg .fwd b{color:#fff;font-weight:600}
.msg .reply{
  background:rgba(255,255,255,.08);
  border-left:3px solid var(--accent);
  border-radius:8px;
  padding:4px 8px;margin-bottom:4px;font-size:12.5px;
}
.msg .reply b{display:block;color:var(--accent);font-weight:600;margin-bottom:1px}
.msg .txt{white-space:pre-wrap;word-break:break-word}
.msg a{color:var(--link);text-decoration:none}
.msg .meta{
  float:right;margin-left:8px;margin-top:3px;
  font-size:11.5px;opacity:.75;
  display:inline-flex;align-items:center;gap:3px;
  white-space:nowrap;
}
.msg .checks{display:inline-flex;align-items:center}
.msg .checks svg{width:16px;height:11px;display:block}
.msg .checks svg .tick{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;stroke:#fff}
.msg .checks.read svg .tick{stroke:#8ee87a}
.msg .checks.sent svg .tick{stroke:rgba(255,255,255,.65)}
.msg img,.msg video{max-width:100%;border-radius:12px;display:block;margin-bottom:4px}
.msg audio{width:220px;max-width:100%;margin-bottom:4px}
.msg .reactions{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.msg .reaction{background:rgba(255,255,255,.15);border-radius:10px;padding:2px 7px;font-size:12px}

/* ═══ PINNED ═══ */
.pinned-bar{
  background:var(--panel);margin:0 10px 6px;
  padding:8px 14px;border-radius:14px;
  display:flex;gap:10px;align-items:center;flex-shrink:0;
  backdrop-filter:blur(14px);
}
.pinned-bar .bar-strip{width:3px;background:var(--accent);height:30px;border-radius:2px;flex-shrink:0}
.pinned-bar .pin-info{flex:1;min-width:0}
.pinned-bar .pin-title{color:var(--accent);font-size:12px;font-weight:600}
.pinned-bar .pin-text{color:#fff;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.pinned-bar .close{color:var(--muted);cursor:pointer;font-size:18px;padding:4px}

/* ═══ INPUT ═══ */
.input-area{
  display:flex;padding:6px 10px;
  gap:8px;flex-shrink:0;align-items:flex-end;
  padding-bottom:calc(6px + env(safe-area-inset-bottom));
}
.input-wrap{
  flex:1;background:var(--panel);
  border-radius:26px;padding:3px 3px 3px 6px;
  display:flex;align-items:flex-end;gap:2px;
  backdrop-filter:blur(14px);
}
.input-wrap textarea{
  flex:1;padding:10px 6px;border:none;background:transparent;color:#fff;
  font-size:16px;outline:none;resize:none;max-height:120px;font-family:inherit;
  min-height:22px;
}
.input-wrap textarea::placeholder{color:var(--muted)}
.input-btn{
  width:38px;height:38px;border-radius:50%;border:none;background:transparent;
  color:var(--muted);font-size:22px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.input-btn:active{color:var(--accent)}
.send-btn{
  width:44px;height:44px;border-radius:50%;border:none;
  background:linear-gradient(135deg,var(--out1),var(--out2));
  color:#fff;font-size:20px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  box-shadow:0 2px 8px rgba(79,100,224,.45);
}
.send-btn:active{transform:scale(.94)}
.send-btn.recording{background:#e53935;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.6}}

/* ═══ REPLY PREVIEW ═══ */
.reply-preview{
  background:var(--panel);margin:0 10px 6px;
  padding:8px 14px;border-radius:14px;
  display:flex;gap:10px;align-items:center;flex-shrink:0;
  backdrop-filter:blur(14px);
}
.reply-preview .bar-strip{width:3px;background:var(--accent);height:30px;border-radius:2px}
.reply-preview .rp-info{flex:1;min-width:0}
.reply-preview .rp-name{color:var(--accent);font-size:12px;font-weight:600}
.reply-preview .rp-text{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.reply-preview .close{color:var(--muted);cursor:pointer;font-size:18px;padding:4px}

/* ═══ LISTS / BOTTOM NAV ═══ */
.content{flex:1;overflow-y:auto;padding:0 10px}
.list-item{padding:10px 6px;display:flex;align-items:center;gap:12px;cursor:pointer;border-radius:14px}
.list-item:active{background:rgba(255,255,255,.04)}
.list-item .info{flex:1;min-width:0;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.list-item:last-child .info{border-bottom:none}
.list-item .name{font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list-item .sub{color:var(--muted);font-size:14px;margin-top:3px}
.list-item .sub.online{color:var(--online)}
.bottom-nav{
  display:flex;background:var(--panel);
  margin:0 10px calc(10px + env(safe-area-inset-bottom));
  border-radius:28px;padding:6px;
  flex-shrink:0;backdrop-filter:blur(14px);
}
.nav-item{
  flex:1;padding:8px 4px 7px;text-align:center;
  color:var(--muted);cursor:pointer;font-size:11px;font-weight:500;
  border-radius:22px;transition:background .15s;
}
.nav-item.active{color:#fff;background:rgba(255,255,255,.08)}
.nav-item .ni{font-size:19px;display:block;margin-bottom:2px}

/* ═══ PROFILE ═══ */
.profile-hero{padding:22px 16px 18px;text-align:center;background:var(--panel);border-radius:20px;margin-top:8px;backdrop-filter:blur(14px)}
.profile-hero .avatar-zone{position:relative;display:inline-block;margin-bottom:14px}
.profile-hero .camera{position:absolute;bottom:2px;right:2px;width:32px;height:32px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;border:3px solid var(--panel);cursor:pointer}
.profile-hero .pname{font-size:22px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px}
.profile-hero .pname .v{color:var(--accent);font-size:16px}
.profile-hero .pstatus{color:var(--accent);font-size:14px;margin-top:6px;font-weight:500}
.profile-hero .pstatus.online{color:var(--online)}
.profile-actions{display:flex;gap:8px;margin-top:18px}
.profile-actions .act{flex:1;background:rgba(255,255,255,.06);border-radius:14px;padding:10px 4px;text-align:center;cursor:pointer}
.profile-actions .act .ai{font-size:20px;color:var(--accent);margin-bottom:4px}
.profile-actions .act .at{font-size:12px;color:var(--accent);font-weight:500}
.info-card{margin:8px 0;background:var(--panel);border-radius:16px;overflow:hidden;backdrop-filter:blur(14px)}
.info-row{padding:12px 16px}
.info-row+.info-row{border-top:1px solid rgba(255,255,255,.05)}
.info-row .lbl{color:var(--accent);font-size:13px}
.info-row .val{color:#fff;font-size:16px;margin-top:2px}
.usernames{padding:14px 16px}
.u-primary{color:var(--accent);font-size:18px;font-weight:500;cursor:pointer;display:inline-block;margin-bottom:4px}
.u-label{color:var(--muted);font-size:14px}
.u-secondary{color:var(--accent);font-size:15px;cursor:pointer;line-height:1.8;margin-right:2px}
.usernames .hint{color:var(--muted);font-size:12px;margin-top:10px;line-height:1.4}

/* ═══ GIFTS ═══ */
.gifts-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:12px 0}
.gift{background:var(--panel);border-radius:16px;padding:16px 8px;text-align:center;cursor:pointer;border:1.5px solid transparent;backdrop-filter:blur(14px)}
.gift:active{transform:scale(.95);border-color:var(--accent)}
.gift .g-emoji{font-size:40px;margin-bottom:8px;line-height:1}
.gift .g-name{font-size:13px;color:#fff;font-weight:600}
.gift .g-price{font-size:12px;color:#f5c451;margin-top:4px}
.gift-to-wrap{padding:12px 16px;background:var(--panel);border-radius:16px;margin:8px 0;backdrop-filter:blur(14px)}
.gift-to-wrap label{display:block;color:var(--muted);font-size:13px;margin-bottom:6px}
.gift-to-wrap select{width:100%;padding:12px 14px;border-radius:12px;background:rgba(0,0,0,.35);color:#fff;border:1.5px solid rgba(255,255,255,.1);font-size:15px;outline:none}

/* ═══ SETTINGS ═══ */
.settings-hero{padding:22px 16px;text-align:center;background:var(--panel);border-radius:20px;margin-top:8px;cursor:pointer;backdrop-filter:blur(14px)}
.settings-hero .avatar{margin:0 auto 12px}
.settings-hero .sname{font-size:20px;font-weight:600}
.settings-hero .suname{color:var(--accent);font-size:14px;margin-top:4px}
.settings-hero .sbio{color:var(--muted);font-size:14px;margin-top:8px}
.settings-group{margin:8px 0;background:var(--panel);border-radius:16px;overflow:hidden;backdrop-filter:blur(14px)}
.settings-item{padding:14px 16px;display:flex;align-items:center;gap:14px;cursor:pointer;font-size:16px}
.settings-item+.settings-item{border-top:1px solid rgba(255,255,255,.05)}
.settings-item:active{background:rgba(255,255,255,.04)}
.settings-item .si{font-size:20px;width:24px;text-align:center;color:var(--accent);flex-shrink:0}
.settings-item .st{flex:1;color:#fff}
.settings-item .arrow{color:var(--muted);font-size:18px}

.section-title{padding:16px 4px 6px;font-size:13px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.6px}
.empty{padding:60px 20px;text-align:center;color:var(--muted);font-size:15px;line-height:1.5}

/* ═══ TOAST ═══ */
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.85);color:#fff;padding:10px 20px;border-radius:20px;font-size:14px;z-index:200;opacity:0;transition:opacity .3s;pointer-events:none;backdrop-filter:blur(10px)}
.toast.show{opacity:1}

/* ═══ CONTEXT MENU ═══ */
.ctx-menu{position:fixed;bottom:0;left:0;right:0;background:var(--panel);border-radius:20px 20px 0 0;padding:12px 0 calc(12px + env(safe-area-inset-bottom));z-index:150;transform:translateY(100%);transition:transform .25s;box-shadow:0 -10px 40px rgba(0,0,0,.5);backdrop-filter:blur(20px)}
.ctx-menu.active{transform:translateY(0)}
.ctx-item{padding:15px 24px;display:flex;align-items:center;gap:14px;font-size:16px;cursor:pointer}
.ctx-item:active{background:rgba(255,255,255,.06)}
.ctx-item.danger{color:#f66}
.ctx-item .ci{font-size:20px;width:26px;color:var(--accent)}
.ctx-item.danger .ci{color:#f66}
.ctx-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:140;display:none}
.ctx-backdrop.active{display:block}
.modal{position:fixed;inset:0;background:var(--bg);display:none;z-index:100;flex-direction:column}
.modal.active{display:flex}
.modal .content{max-width:480px;margin:0 auto;width:100%}
.file-input{display:none}

/* ═══ EMOJI PICKER ═══ */
.emoji-picker{position:fixed;bottom:80px;left:10px;right:10px;background:var(--panel);border-radius:16px;padding:14px;z-index:120;display:none;box-shadow:0 -5px 30px rgba(0,0,0,.6);backdrop-filter:blur(20px)}
.emoji-picker.active{display:block}
.emoji-row{display:flex;gap:8px;flex-wrap:wrap}
.emoji-row span{font-size:28px;cursor:pointer;padding:4px;border-radius:8px}
.emoji-row span:active{background:rgba(255,255,255,.1)}

/* ═══ CONN INDICATOR — тонкая полоска сверху ═══ */
.conn-status{position:fixed;top:0;left:0;right:0;text-align:center;padding:3px;font-size:11px;background:linear-gradient(90deg,var(--out1),var(--out2));color:#fff;z-index:300;display:none}
.conn-status.show{display:block}

/* ═══ LOADING ═══ */
.loading{position:fixed;inset:0;background:var(--bg);z-index:400;display:none;align-items:center;justify-content:center;flex-direction:column;gap:20px}
.loading.show{display:flex}
.spinner{width:44px;height:44px;border:3px solid #232e3c;border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading .lt{color:var(--accent);font-size:14px}
</style>
</head>
<body>

<div class="conn-status" id="connStatus"></div>

<div class="loading" id="loadingScreen">
  <div class="spinner"></div>
  <div class="lt">Восстанавливаем сессию...</div>
</div>

<!-- ═══ LOGIN ═══ -->
<div class="screen active" id="loginScreen">
  <div class="app-bg"></div>
  <div class="logo">M</div>
  <h1>Messenger</h1>
  <div class="field"><input id="u" placeholder="username" autocomplete="off" autocapitalize="off"></div>
  <div class="field"><input id="p" placeholder="пароль" type="password"></div>
  <button class="btn" onclick="doLogin()">Войти</button>
  <button class="btn secondary" onclick="doRegister()">Создать аккаунт</button>
  <div class="error" id="err"></div>
</div>

<!-- ═══ MAIN ═══ -->
<div class="screen" id="mainScreen">
  <div class="app-bg"></div>
  <div class="bar">
    <div class="pill full">
      <h1 id="screenTitle" style="flex:1;font-size:19px;font-weight:700;padding:0 16px">Чаты</h1>
      <div id="geoInfo" style="font-size:11px;color:var(--muted);padding-right:12px"></div>
    </div>
  </div>
  <div class="content" id="mainContent"></div>
  <div class="bottom-nav">
    <div class="nav-item active" data-tab="chats" onclick="switchTab('chats')"><span class="ni">💬</span>Чаты</div>
    <div class="nav-item" data-tab="users" onclick="switchTab('users')"><span class="ni">👥</span>Люди</div>
    <div class="nav-item" data-tab="gifts" onclick="switchTab('gifts')"><span class="ni">🎁</span>Подарки</div>
    <div class="nav-item" data-tab="settings" onclick="switchTab('settings')"><span class="ni">⚙</span>Ещё</div>
  </div>
</div>

<!-- ═══ CHAT ═══ -->
<div class="screen" id="chatScreen">
  <div class="app-bg"></div>
  <div class="bar">
    <button class="btn" onclick="closeChat()">
      <svg class="ic" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div class="pill" style="flex:1;padding:0 6px">
      <div class="who" onclick="openProfile(currentChat)">
        <div class="ava sm" id="chatAvatar">?</div>
        <div style="flex:1;min-width:0">
          <b id="chatName">Чат</b>
          <small id="chatStatus">был(а) недавно</small>
        </div>
      </div>
      <div class="acts">
        <button onclick="openChatMenu()">
          <svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="19" r="1.5"/></svg>
        </button>
      </div>
    </div>
  </div>
  <div id="pinnedBar"></div>
  <div id="list"></div>
  <div id="replyPreview"></div>
  <div class="input-area">
    <div class="input-wrap">
      <button class="input-btn" onclick="toggleEmoji()">☺</button>
      <textarea id="msgInput" placeholder="Сообщение" rows="1"
        oninput="autoResize(this); updateSendOrMic();"

<div class="ctx-menu" id="ctxMenu"></div>
<div class="toast" id="toastEl"></div>

<script>
const WS_URL = location.origin.replace("https://","wss://").replace("http://","ws://") + "/ws";

let ws=null, me=null, meName=null;
let currentChat=null, currentProfileUser=null;
let users=[], currentTab='chats', chats={}, avatarCache={};
let replyTo=null, editingMsg=null, msgCache={};
let reconnectDelay=1000, heartbeatTimer=null;
let myToken = localStorage.getItem("token") || null;
let pendingLogin = null;
let savedCreds = null;
try { const s=localStorage.getItem("creds"); if(s) savedCreds=JSON.parse(s); } catch(e){}
let bootDone=false, isRecording=false, mediaRecorder=null, audioChunks=[];

const cleanU = s => String(s||"").replace(/^@+/, "");

async function loadGeo(){
  try {
    const r = await fetch("/geo");
    const d = await r.json();
    const el = document.getElementById("geoInfo");
    if (el) el.innerText = d.code ? (d.code + " " + d.timezone) : "";
  } catch(e){}
}

/* ═══ ВРЕМЯ ═══ */
function fmtTime(iso){
  if(!iso) return "?";
  try {
    const s = iso.endsWith("Z")||iso.includes("+") ? iso : iso+"Z";
    const d = new Date(s);
    return d.toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"});
  } catch(e){ return "?"; }
}
function fmtLastSeen(iso){
  if(!iso) return "был(а) недавно";
  try {
    const s = iso.endsWith("Z")||iso.includes("+") ? iso : iso+"Z";
    const d = new Date(s), now = new Date();
    const diff = (now-d)/1000;
    if(diff<60) return "был(а) только что";
    if(diff<3600) return "был(а) "+Math.floor(diff/60)+" мин назад";
    if(diff<86400) return "был(а) "+Math.floor(diff/3600)+" ч назад";
    return "был(а) "+d.toLocaleDateString("ru-RU",{day:"2-digit",month:"2-digit"});
  } catch(e){ return "был(а) недавно"; }
}

/* ═══ ГАЛОЧКИ ═══ */
function tickOne(){ return `<svg viewBox="0 0 16 11"><path class="tick" d="M1 5.5 L5.5 10 L14.5 1"/></svg>`; }
function tickTwo(){ return `<svg viewBox="0 0 22 11"><path class="tick" d="M1 5.5 L5.5 10 L14.5 1"/><path class="tick" d="M6 5.5 L10.5 10 L19.5 1"/></svg>`; }

function showLoading(show){ document.getElementById("loadingScreen").classList.toggle("show",show); }

/* ═══ КЛАВИАТУРА ═══ */
function setupKeyboardTracking(){
  if(!window.visualViewport) return;
  const vv = window.visualViewport;
  function adjust(){
    const kb = Math.max(0, window.innerHeight - vv.height);
    document.body.style.height = (window.innerHeight - kb) + 'px';
    const c = document.getElementById("list");
    if(c) c.scrollTop = c.scrollHeight;
  }
  vv.addEventListener('resize', adjust);
  vv.addEventListener('scroll', adjust);
  const inp = document.getElementById("msgInput");
  if(inp){
    inp.addEventListener('focus', ()=>setTimeout(adjust,100));
    inp.addEventListener('blur', ()=>setTimeout(()=>{ document.body.style.height=''; adjust(); },100));
  }
  adjust();
}

/* ═══ CONNECT ═══ */
function connect(){
  console.log("WS →", WS_URL);
  ws = new WebSocket(WS_URL);
  ws.onopen = ()=>{
    console.log("WS OPEN");
    reconnectDelay = 1000;
    const cs = document.getElementById("connStatus");
    if(cs){ cs.classList.remove("show"); cs.innerText=""; }
    if(pendingLogin){ send(pendingLogin); }
    else if(myToken){ send({cmd:"resume", token: myToken}); }
    else if(savedCreds && savedCreds.username && savedCreds.password){
      pendingLogin = {cmd:"login", username: savedCreds.username, password: savedCreds.password};
      send(pendingLogin);
    }
    if(heartbeatTimer) clearInterval(heartbeatTimer);
    heartbeatTimer = setInterval(()=>{ if(ws && ws.readyState===1) ws.send(JSON.stringify({cmd:"ping"})); }, 15000);
  };
  ws.onmessage = e=>{ let d; try{ d=JSON.parse(e.data); }catch{ return; } handle(d); };
  ws.onerror = e=>console.error("WS ERR",e);
  ws.onclose = e=>{
    console.warn("WS CLOSE", e.code, e.reason);
    if(heartbeatTimer) clearInterval(heartbeatTimer);
    if(bootDone || me){
      const cs = document.getElementById("connStatus");
      if(cs){ cs.innerText = "Переподключение..."; cs.classList.add("show"); }
    }
    setTimeout(connect, reconnectDelay);
    reconnectDelay = Math.min(reconnectDelay*2, 30000);
  };
}

function send(o){
  if(ws && ws.readyState===1) ws.send(JSON.stringify(o));
  else console.warn("WS not open");
}
function err(m){ const e=document.getElementById("err"); if(e) e.innerText=m; }

function doLogin(){
  const u = cleanU(document.getElementById("u").value);
  const p = document.getElementById("p").value;
  if(!u||!p) return err("Заполни всё");
  pendingLogin = {cmd:"login", username:u, password:p};
  savedCreds = {username:u, password:p};
  try{ localStorage.setItem("creds", JSON.stringify(savedCreds)); }catch(e){}
  send(pendingLogin);
}
function doRegister(){
  const u = cleanU(document.getElementById("u").value);
  const p = document.getElementById("p").value;
  if(!u||!p) return err("Заполни всё");
  pendingLogin = {cmd:"register", username:u, password:p};
  savedCreds = {username:u, password:p};
  try{ localStorage.setItem("creds", JSON.stringify(savedCreds)); }catch(e){}
  send(pendingLogin);
}

/* ═══ HANDLE ═══ */
function handle(d){
  if(d.type==="registered" || d.type==="logged_in"){
    me = d.user_id; meName = me;
    if(d.token){ myToken = d.token; localStorage.setItem("token", d.token); }
    if(pendingLogin && (pendingLogin.cmd==="login" || pendingLogin.cmd==="register")){
      savedCreds = {username: pendingLogin.username, password: pendingLogin.password};
      try{ localStorage.setItem("creds", JSON.stringify(savedCreds)); }catch(e){}
    }
    pendingLogin = null; bootDone = true;
    showLoading(false);
    showScreen("mainScreen");
    document.getElementById("err").innerText = "";
    const cs = document.getElementById("connStatus");
    if(cs) cs.classList.remove("show");
    send({cmd:"users"});
    send({cmd:"profile", user: me});
    switchTab("chats");
    loadGeo();
  }
  else if(d.type==="pong"){}
  else if(d.type==="users"){
    users = d.list || [];
    if(currentTab==="users") renderUsers();
    if(currentTab==="chats") renderChats();
    if(currentTab==="gifts") renderGiftsShop();
  }
  else if(d.type==="user_online" || d.type==="user_offline"){
    const u = users.find(x=>x.u===d.user);
    if(u) u.online = (d.type==="user_online");
    if(currentChat===d.user) updateChatStatus();
    if(currentTab==="users") renderUsers();
  }
  else if(d.type==="search_results") renderSearchResults(d.list||[]);
  else if(d.type==="contact_added"){ toast("@"+d.user+" добавлен"); closeModal("searchModal"); send({cmd:"users"}); }
  else if(d.type==="history") renderHistory(d.msgs);
  else if(d.type==="msg"){
    if(currentChat===d.from){
      const c = document.getElementById("list");
      addMessage(c, d, false);
      c.scrollTop = c.scrollHeight;
      send({cmd:"mark_read", with: d.from});
    }
    chats[d.from] = {text: d.text||"[медиа]", ts: d.ts, unread: (chats[d.from]?.unread||0) + (currentChat===d.from?0:1)};
  }
  else if(d.type==="sent"){
    if(currentChat===d.to){
      const c = document.getElementById("list");
      addMessage(c, d, true, d.delivered);
      c.scrollTop = c.scrollHeight;
    }
    chats[d.to] = {text: d.text||"[медиа]", ts: d.ts, unread: 0};
  }
  else if(d.type==="msg_read"){
    (d.ids||[]).forEach(id=>{
      const el = document.querySelector(`[data-mid="${id}"] .checks`);
      if(el){ el.className = "checks read"; el.innerHTML = tickTwo(); }
    });
  }
  else if(d.type==="msg_edited"){
    const el = document.querySelector(`[data-mid="${d.msg_id}"] .txt`);
    if(el) el.innerText = d.text;
  }
  else if(d.type==="msg_deleted"){
    const el = document.querySelector(`[data-mid="${d.msg_id}"]`);
    if(el) el.remove();
  }
  else if(d.type==="reactions_updated"){
    const el = document.querySelector(`[data-mid="${d.msg_id}"] .reactions`);
    if(el) el.innerHTML = d.reactions.map(r=>`<span class="reaction">${r.emoji} ${r.count}</span>`).join('');
  }
  else if(d.type==="msg_pinned") showPinned(d);
  else if(d.type==="msg_unpinned") hidePinned();
  else if(d.type==="profile"){
    window._lastProfile = d;
    if(d.user===me) meName = d.first_name;
    if(d.avatar) loadAvatar(d.avatar);
    if(document.getElementById("profileScreen").classList.contains("active")) renderProfile(d);
    if(currentTab==="settings") renderSettings(d);
  }
  else if(d.type==="avatar_data"){
    if(d.data){ avatarCache[d.file]=d.data; refreshAvatars(); }
  }
  else if(d.type==="profile_updated"){ send({cmd:"profile", user:me}); send({cmd:"users"}); }
  else if(d.type==="username_added"){ toast("@"+d.username+" добавлен"); if(currentProfileUser) send({cmd:"profile", user:currentProfileUser}); }
  else if(d.type==="username_deleted"){ toast("@"+d.username+" удалён"); if(currentProfileUser) send({cmd:"profile", user:currentProfileUser}); }
  else if(d.type==="primary_updated"){ toast("Основной: @"+d.username); send({cmd:"users"}); if(currentProfileUser) send({cmd:"profile", user:currentProfileUser}); }
  else if(d.type==="gift_received") toast(d.from+" подарил "+d.name+" "+d.stars+"★");
  else if(d.type==="gift_sent") toast("Подарок отправлен @"+d.to);
  else if(d.type==="chat_deleted"){ delete chats[d.with]; toast("Чат очищен"); }
  else if(d.type==="error"){
    if(d.msg==="session expired"){
      myToken = null; localStorage.removeItem("token");
      if(savedCreds && savedCreds.username && savedCreds.password){
        pendingLogin = {cmd:"login", username: savedCreds.username, password: savedCreds.password};
        send(pendingLogin);
        return;
      }
      me=null; bootDone=false; showLoading(false); showScreen("loginScreen");
      err("Сессия истекла, войдите заново");
      return;
    }
    err(d.msg);
    if(me) toast("Ошибка: "+d.msg);
  }
}

function loadAvatar(f){ if(!f || avatarCache[f]) return; send({cmd:"get_avatar", file: f}); }
function showScreen(id){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

function switchTab(tab){
  currentTab = tab;
  document.querySelectorAll(".nav-item").forEach(t=>t.classList.toggle("active", t.dataset.tab===tab));
  document.getElementById("screenTitle").innerText = {chats:"Чаты",users:"Люди",gifts:"Подарки",settings:"Ещё"}[tab];
  if(tab==="chats") renderChats();
  else if(tab==="users"){ send({cmd:"users"}); renderUsers(); }
  else if(tab==="gifts") renderGiftsShop();
  else if(tab==="settings"){ renderSettings(window._lastProfile); send({cmd:"profile", user:me}); }
}

function renderChats(){
  const c = document.getElementById("mainContent");
  const keys = Object.keys(chats);
  if(!keys.length){ c.innerHTML='<div class="empty">Нет диалогов<br><br>Открой <b>Люди</b> и выбери кого-то</div>'; return; }
  c.innerHTML = "";
  for(const u of keys){
    const ch = chats[u];
    c.appendChild(userItem(u, ch.text, ch.ts, ch.unread));
  }
}

function renderUsers(){
  const c = document.getElementById("mainContent");
  c.innerHTML = `
    <div style="padding:8px 6px">
      <input id="userSearchInput" placeholder="Поиск..." oninput="filterUsers(this.value)" autocomplete="off" style="width:100%;padding:12px 16px;border-radius:14px;background:var(--panel);color:#fff;border:none;font-size:15px;outline:none;backdrop-filter:blur(14px)">
    </div>
    <div class="list-item" onclick="openSearchModal()">
      <div class="ava" style="background:linear-gradient(135deg,var(--out1),var(--out2));font-size:26px">+</div>
      <div class="info">
        <div class="name" style="color:var(--accent)">Добавить пользователя</div>
        <div class="sub">найти по @username</div>
      </div>
    </div>
    <div id="usersList"></div>`;
  filterUsers("");
}

function filterUsers(q){
  const wrap = document.getElementById("usersList");
  if(!wrap) return;
  q = (q||"").toLowerCase().trim().replace(/^@+/,"");
  const list = users.filter(x=> x.u!==me && (!q || x.u.includes(q) || (x.n||'').toLowerCase().includes(q)));
  if(!list.length){ wrap.innerHTML='<div class="empty">Никого не найдено</div>'; return; }
  wrap.innerHTML = "";
  for(const x of list){
    const el = document.createElement("div");
    el.className = "list-item";
    el.onclick = ()=>openChat(x.u);
    const avHtml = x.av && avatarCache[x.av]
      ? `<div class="ava" style="background-image:url('${avatarCache[x.av]}');color:transparent">${x.online?'<div class="online-dot"></div>':''}</div>`
      : `<div class="ava">${initials(x.u)}${x.online?'<div class="online-dot"></div>':''}</div>`;
    el.innerHTML = `${avHtml}<div class="info"><div class="name">${escapeHtml(x.n||x.u)}</div><div class="sub ${x.online?'online':''}">${x.online?'в сети':fmtLastSeen(x.ls)}</div></div>`;
    wrap.appendChild(el);
    if(x.av) loadAvatar(x.av);
  }
}

function refreshAvatars(){
  if(currentTab==="users"){ const q=document.getElementById("userSearchInput")?.value||""; filterUsers(q); }
  if(currentTab==="chats") renderChats();
  if(currentTab==="settings") renderSettings(window._lastProfile);
  if(currentProfileUser) send({cmd:"profile", user:currentProfileUser});
}

function userItem(u, sub, ts, unread){
  const el = document.createElement("div");
  el.className = "list-item";
  el.onclick = ()=>openChat(u);
  const time = ts ? fmtTime(ts) : "";
  const badge = unread ? `<div style="background:linear-gradient(135deg,var(--out1),var(--out2));color:#fff;border-radius:11px;min-width:22px;height:22px;padding:0 7px;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center">${unread}</div>` : "";
  const usr = users.find(x=>x.u===u);
  const av = usr ? usr.av : "";
  const online = usr ? usr.online : false;
  if(av) loadAvatar(av);
  const avHtml = av && avatarCache[av]
    ? `<div class="ava" style="background-image:url('${avatarCache[av]}');color:transparent">${online?'<div class="online-dot"></div>':''}</div>`
    : `<div class="ava">${initials(u)}${online?'<div class="online-dot"></div>':''}</div>`;
  el.innerHTML = `${avHtml}<div class="info"><div class="name">${escapeHtml(u)}</div><div class="sub">${escapeHtml(sub||"")}</div></div><div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px"><div style="color:var(--muted);font-size:12px">${time}</div>${badge}</div>`;
  return el;
}

function openSearchModal(){
  document.getElementById("searchModal").classList.add("active");
  document.getElementById("searchInput").value = "";
  document.getElementById("searchResults").innerHTML = "";
}
function doSearch(q){
  q = (q||"").trim().toLowerCase().replace(/^@+/,"");
  if(q.length<2){ document.getElementById("searchResults").innerHTML = ""; return; }
  send({cmd:"search_users", q});
}
function renderSearchResults(list){
  const c = document.getElementById("searchResults");
  if(!list.length){ c.innerHTML='<div class="empty" style="padding:20px">Никого не найдено</div>'; return; }
  c.innerHTML = "";
  for(const x of list){
    const el = document.createElement("div");
    el.className = "list-item";
    el.onclick = ()=>send({cmd:"add_contact", user: x.u});
    el.innerHTML = `<div class="ava">${initials(x.u)}</div><div class="info"><div class="name">${escapeHtml(x.n||x.u)}</div><div class="sub">@${escapeHtml(x.u)}</div></div>`;
    c.appendChild(el);
  }
}

function updateChatStatus(){
  const usr = users.find(x=>x.u===currentChat);
  const st = document.getElementById("chatStatus");
  if(!st) return;
  if(usr && usr.online){ st.innerText="в сети"; st.classList.add("online"); }
  else { st.innerText = usr ? fmtLastSeen(usr.ls) : "был(а) недавно"; st.classList.remove("online"); }
}

function openChat(u){
  u = cleanU(u);
  currentChat = u;
  replyTo = null; editingMsg = null;
  clearReplyPreview();
  if(chats[u]) chats[u].unread = 0;
  document.getElementById("chatName").innerText = u;
  const usr = users.find(x=>x.u===u);
  const av = usr ? usr.av : "";

function addMessage(container, d, isMe, delivered){
  const wrap = document.createElement("div");
  wrap.className = "msg " + (isMe ? "out" : "in");
  wrap.setAttribute("data-mid", d.id);
  const time = fmtTime(d.ts);
  let h = "";
  if(d.forwarded_from) h += `<div class="fwd">Переслано от <b>@${escapeHtml(d.forwarded_from)}</b></div>`;
  if(d.reply_to){
    const orig = msgCache[d.reply_to];
    if(orig) h += `<div class="reply"><b>${escapeHtml(orig.from)}</b>${escapeHtml((orig.text||'').slice(0,60))}</div>`;
  }
  let media = "";
  if(d.media_url){
    if(d.media_type==="image") media = `<img src="${d.media_url}" onclick="window.open('${d.media_url}','_blank')">`;
    else if(d.media_type==="video") media = `<video src="${d.media_url}" controls></video>`;
    else if(d.media_type==="audio") media = `<audio src="${d.media_url}" controls></audio>`;
    else media = `<a href="${d.media_url}" target="_blank">📎 файл</a>`;
  }
  h += media;
  h += `<span class="txt">${escapeHtml(d.text||'')}</span>`;
  if(isMe){
    let tick = tickOne();
    if(d.read) tick = tickTwo();
    else if(delivered) tick = tickTwo();
    const cls = d.read ? "read" : (delivered ? "delivered" : "sent");
    h += `<span class="meta">${time}<span class="checks ${cls}">${tick}</span></span>`;
  } else {
    h += `<span class="meta">${time}</span>`;
  }
  if(d.reactions && d.reactions.length){
    h += `<div class="reactions">${d.reactions.map(r=>`<span class="reaction">${r.emoji} ${r.count}</span>`).join('')}</div>`;
  }
  wrap.innerHTML = h;
  // Долгий тап → меню
  let pressTimer;
  wrap.addEventListener("touchstart", ()=>{ pressTimer = setTimeout(()=>showMsgMenu(d, isMe), 500); });
  wrap.addEventListener("touchend", ()=>clearTimeout(pressTimer));
  wrap.addEventListener("touchmove", ()=>clearTimeout(pressTimer));
  wrap.addEventListener("contextmenu", e=>{ e.preventDefault(); showMsgMenu(d, isMe); });
  container.appendChild(wrap);
  msgCache[d.id] = d;
}

    btn.innerText = "➤";
    btn.classList.remove("recording");
  } else if(isRecording){
    btn.innerText = "◼";
    btn.classList.add("recording");
  } else {
    btn.innerText = "🎤";
    btn.classList.remove("recording");
  }
}

function handleSendOrMic(){
  const inp = document.getElementById("msgInput");
  if(inp.value.trim().length>0){ sendMsg(); }
  else { toggleRecord(); }
}

function toggleRecord(){
  if(isRecording && mediaRecorder && mediaRecorder.state==="recording"){
    mediaRecorder.stop(); isRecording=false; updateSendOrMic(); return;
  }
  if(!navigator.mediaDevices) return toast("Микрофон недоступен");
  navigator.mediaDevices.getUserMedia({audio:true}).then(stream=>{
    mediaRecorder = new MediaRecorder(stream);
    audioChunks = [];
    mediaRecorder.ondataavailable = e=>audioChunks.push(e.data);
    mediaRecorder.onstop = ()=>{
      const blob = new Blob(audioChunks,{type:"audio/webm"});
      if(blob.size<200){ stream.getTracks().forEach(t=>t.stop()); return; }
      const r = new FileReader();
      r.onload = e => send({cmd:"send", to: currentChat, text:"", media_data: e.target.result, media_type:"audio"});
      r.readAsDataURL(blob);
      stream.getTracks().forEach(t=>t.stop());
    };
    mediaRecorder.start(); isRecording = true; updateSendOrMic();
    toast("Запись...");
  }).catch(()=>toast("Микрофон запрещён"));
}

function pickAvatar(event){
  const file = event.target.files[0]; if(!file) return;
  if(file.size > 5*1024*1024) return toast("Файл >5 МБ");
  const reader = new FileReader();
  reader.onload = e=>{
    const dataUrl = e.target.result;
    const img = new Image();
    img.onload = ()=>{
      try {
        const canvas = document.createElement("canvas");
        const maxSize = 512;
        let w = img.width, h = img.height;
        if(w>h){ h = Math.round(h*maxSize/w); w = maxSize; }
        else { w = Math.round(w*maxSize/h); h = maxSize; }
        canvas.width = w; canvas.height = h;
        canvas.getContext("2d").drawImage(img,0,0,w,h);
        saveAvatarImmediately(canvas.toDataURL("image/jpeg", 0.85));
      } catch(err){ saveAvatarImmediately(dataUrl); }
    };
    img.onerror = ()=>saveAvatarImmediately(dataUrl);
    img.src = dataUrl;
  };
  reader.readAsDataURL(file);
  event.target.value = "";
}
function saveAvatarImmediately(compressed){
  const preview = document.getElementById("avatarPreview");
  if(preview){
    preview.style.backgroundImage = "url('"+compressed+"')";
    preview.style.color = "transparent"; preview.innerText = "";

  send({cmd:"update_profile", avatar_data: compressed});
  toast("Фото сохраняется...");
}

function escapeHtml(s){ return String(s||"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c])); }
let toastTimer;
function toast(msg){
  const t = document.getElementById("toastEl");
  t.innerText = msg; t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove("show"), 2000);
}
