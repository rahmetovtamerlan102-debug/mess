<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#17212b">
<title>Messenger</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,system-ui,'Segoe UI',Roboto,sans-serif;background:#0e1621;color:#fff;position:fixed;inset:0}
.screen{display:none;flex-direction:column;height:100%;position:absolute;inset:0}
.screen.active{display:flex}
#loginScreen{justify-content:center;padding:28px;max-width:420px;margin:0 auto;width:100%}
.logo{text-align:center;font-size:56px;margin-bottom:12px;color:#6ab3f3;font-weight:700}
#loginScreen h1{text-align:center;color:#6ab3f3;margin-bottom:32px;font-size:22px;font-weight:600}
.field input{width:100%;padding:15px 16px;border-radius:12px;border:1.5px solid transparent;background:#17212b;color:#fff;font-size:16px;outline:none;margin-bottom:10px}
.field input:focus{border-color:#5288c1}
.btn{width:100%;padding:15px;border-radius:12px;border:none;background:#5288c1;color:#fff;font-size:15px;font-weight:600;cursor:pointer;margin-bottom:10px}
.btn.secondary{background:#232e3c;color:#6ab3f3}
.error{color:#f66;font-size:14px;text-align:center;min-height:20px}
.header{padding:0 8px;background:#17212b;display:flex;align-items:center;gap:4px;border-bottom:1px solid #0e1621;flex-shrink:0;min-height:54px}
.header h1{flex:1;font-size:18px;font-weight:600;text-align:center}
.header-left,.header-right{display:flex;align-items:center;min-width:44px}
.header-right{justify-content:flex-end}
.icon-btn{background:transparent;border:none;color:#6ab3f3;font-size:22px;cursor:pointer;width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:50%}
.back-btn{background:transparent;border:none;color:#6ab3f3;font-size:26px;cursor:pointer;width:40px;height:40px;display:flex;align-items:center;justify-content:center}
.bottom-nav{display:flex;background:#17212b;border-top:1px solid #0e1621;flex-shrink:0;padding-bottom:env(safe-area-inset-bottom)}
.nav-item{flex:1;padding:10px 4px 9px;text-align:center;color:#586e7e;cursor:pointer;font-size:11px;font-weight:500}
.nav-item.active{color:#6ab3f3}
.nav-item .ni{font-size:20px;display:block;margin-bottom:3px}
.content{flex:1;overflow-y:auto}
.list-item{padding:10px 14px;display:flex;align-items:center;gap:12px;cursor:pointer}
.list-item:active{background:#17212b}
.avatar{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,#5288c1,#6ab3f3);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:19px;color:#fff;text-transform:uppercase;flex-shrink:0;overflow:hidden;background-size:cover;background-position:center}
.avatar.sm{width:40px;height:40px;font-size:15px}
.avatar.lg{width:110px;height:110px;font-size:42px}
.list-item .info{flex:1;min-width:0;padding:8px 0;border-bottom:1px solid #17212b}
.list-item:last-child .info{border-bottom:none}
.list-item .name{font-weight:500;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list-item .sub{color:#708499;font-size:14px;margin-top:3px}
#messages{flex:1;overflow-y:auto;padding:10px 8px;display:flex;flex-direction:column;gap:3px;background:#0e1621}
.msg-wrap{display:flex;flex-direction:column;max-width:82%}
.msg-wrap.me{align-self:flex-end}
.msg-wrap.them{align-self:flex-start}
.msg{padding:7px 11px;border-radius:16px;font-size:15px;line-height:1.35;word-wrap:break-word}
.msg.me{background:#2b5278;border-bottom-right-radius:4px}
.msg.them{background:#182533;border-bottom-left-radius:4px}
.msg .txt{white-space:pre-wrap;word-break:break-word}
.msg .meta{display:flex;align-items:center;gap:4px;justify-content:flex-end;font-size:11px;opacity:.7;margin-top:2px}
.msg .checks{font-size:12px;letter-spacing:-2px}
.input-area{display:flex;padding:6px;gap:6px;background:#17212b;border-top:1px solid #0e1621;flex-shrink:0;align-items:flex-end;padding-bottom:calc(6px + env(safe-area-inset-bottom))}
.input-wrap{flex:1;background:#0e1621;border-radius:20px;padding:2px 4px;display:flex;align-items:flex-end;gap:2px}
.input-wrap textarea{flex:1;padding:10px 6px;border:none;background:transparent;color:#fff;font-size:16px;outline:none;resize:none;max-height:120px;font-family:inherit;min-height:20px}
.input-btn{width:36px;height:36px;border-radius:50%;border:none;background:transparent;color:#6ab3f3;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.send-btn{width:44px;height:44px;border-radius:50%;border:none;background:#5288c1;color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.profile-hero{padding:22px 16px 18px;text-align:center;background:#17212b}
.profile-hero .avatar-zone{position:relative;display:inline-block;margin-bottom:14px}
.profile-hero .camera{position:absolute;bottom:2px;right:2px;width:32px;height:32px;border-radius:50%;background:#6ab3f3;color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;border:3px solid #17212b;cursor:pointer}
.profile-hero .pname{font-size:22px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px}
.profile-hero .pname .v{color:#6ab3f3;font-size:16px}
.profile-hero .pstatus{color:#6ab3f3;font-size:14px;margin-top:6px;font-weight:500}
.profile-actions{display:flex;gap:8px;margin-top:18px}
.profile-actions .act{flex:1;background:#232e3c;border-radius:12px;padding:10px 4px;text-align:center;cursor:pointer}
.profile-actions .act .ai{font-size:20px;color:#6ab3f3;margin-bottom:4px}
.profile-actions .act .at{font-size:12px;color:#6ab3f3;font-weight:500}
.info-card{margin:8px;background:#17212b;border-radius:12px;overflow:hidden}
.info-row{padding:12px 16px}
.info-row+.info-row{border-top:1px solid #0e1621}
.info-row .lbl{color:#6ab3f3;font-size:13px}
.info-row .val{color:#fff;font-size:16px;margin-top:2px}
.usernames{padding:14px 16px}
.u-primary{color:#6ab3f3;font-size:18px;font-weight:500;cursor:pointer;display:inline-block;margin-bottom:4px}
.u-label{color:#708499;font-size:14px}
.u-secondary{color:#6ab3f3;font-size:15px;cursor:pointer;line-height:1.8;margin-right:2px}
.usernames .hint{color:#708499;font-size:12px;margin-top:10px;line-height:1.4}
.usernames .add{color:#6ab3f3;font-size:15px;font-weight:600;cursor:pointer;display:inline-block;margin-top:10px}
.gifts-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:12px}
.gift{background:#17212b;border-radius:14px;padding:16px 8px;text-align:center;cursor:pointer;border:1.5px solid transparent}
.gift:active{transform:scale(.95);background:#1f2b3a;border-color:#5288c1}
.gift .g-emoji{font-size:40px;margin-bottom:8px;line-height:1}
.gift .g-name{font-size:13px;color:#fff;font-weight:600}
.gift .g-price{font-size:12px;color:#f5c451;margin-top:4px}
.gift-to-wrap{padding:12px 16px;background:#17212b;margin-bottom:8px}
.gift-to-wrap label{display:block;color:#708499;font-size:13px;margin-bottom:6px}
.gift-to-wrap select{width:100%;padding:12px 14px;border-radius:10px;background:#0e1621;color:#fff;border:1.5px solid #2b3a4a;font-size:15px;outline:none}
.settings-hero{padding:22px 16px;text-align:center;background:#17212b;cursor:pointer}
.settings-hero .avatar{margin:0 auto 12px}
.settings-hero .sname{font-size:20px;font-weight:600}
.settings-hero .suname{color:#6ab3f3;font-size:14px;margin-top:4px}
.settings-hero .sbio{color:#708499;font-size:14px;margin-top:8px}
.settings-group{margin:8px;background:#17212b;border-radius:12px;overflow:hidden}
.settings-item{padding:14px 16px;display:flex;align-items:center;gap:14px;cursor:pointer;font-size:16px}
.settings-item+.settings-item{border-top:1px solid #0e1621}
.settings-item:active{background:#1f2b3a}
.settings-item .si{font-size:20px;width:24px;text-align:center;color:#6ab3f3;flex-shrink:0}
.settings-item .st{flex:1;color:#fff}
.settings-item .sv{color:#708499;font-size:14px;max-width:130px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.settings-item .arrow{color:#586e7e;font-size:18px}
.section-title{padding:16px 16px 6px;font-size:13px;color:#708499;font-weight:600;text-transform:uppercase;letter-spacing:.6px}
.empty{padding:60px 20px;text-align:center;color:#586e7e;font-size:15px;line-height:1.5}
.toast{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.85);color:#fff;padding:10px 20px;border-radius:20px;font-size:14px;z-index:200;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
.ctx-menu{position:fixed;bottom:0;left:0;right:0;background:#17212b;border-radius:20px 20px 0 0;padding:12px 0 calc(12px + env(safe-area-inset-bottom));z-index:150;transform:translateY(100%);transition:transform .25s;box-shadow:0 -10px 40px rgba(0,0,0,.5)}
.ctx-menu.active{transform:translateY(0)}
.ctx-item{padding:15px 24px;display:flex;align-items:center;gap:14px;font-size:16px;cursor:pointer}
.ctx-item:active{background:#1f2b3a}
.ctx-item.danger{color:#f66}
.ctx-item .ci{font-size:20px;width:26px;color:#6ab3f3}
.ctx-item.danger .ci{color:#f66}
.ctx-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:140;display:none}
.ctx-backdrop.active{display:block}
.modal{position:fixed;inset:0;background:#0e1621;display:none;z-index:100}
.modal.active{display:flex;flex-direction:column}
.file-input{display:none}
</style>
</head>
<body>

<div class="screen active" id="loginScreen">
  <div class="logo">M</div>
  <h1>Messenger</h1>
  <div class="field"><input id="u" placeholder="username" autocomplete="off" autocapitalize="off"></div>
  <div class="field"><input id="p" placeholder="пароль" type="password"></div>
  <button class="btn" onclick="doLogin()">Войти</button>
  <button class="btn secondary" onclick="doRegister()">Создать аккаунт</button>
  <div class="error" id="err"></div>
</div>

<div class="screen" id="mainScreen">
  <div class="header">
    <div class="header-left"></div>
    <h1 id="screenTitle">Чаты</h1>
    <div class="header-right"></div>
  </div>
  <div class="content" id="mainContent"></div>
  <div class="bottom-nav">
    <div class="nav-item active" data-tab="chats" onclick="switchTab('chats')"><span class="ni">▢</span>Чаты</div>
    <div class="nav-item" data-tab="users" onclick="switchTab('users')"><span class="ni">◯</span>Контакты</div>
    <div class="nav-item" data-tab="gifts" onclick="switchTab('gifts')"><span class="ni">◆</span>Подарки</div>
    <div class="nav-item" data-tab="settings" onclick="switchTab('settings')"><span class="ni">⚙</span>Настройки</div>
  </div>
</div>

<div class="screen" id="chatScreen">
  <div class="header">
    <div class="header-left"><button class="back-btn" onclick="closeChat()">←</button></div>
    <div class="avatar sm" id="chatAvatar" onclick="openProfile(currentChat)">?</div>
    <div style="flex:1;min-width:0;padding:0 6px" onclick="openProfile(currentChat)">
      <div style="font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" id="chatName">Чат</div>
      <div style="font-size:13px;color:#6ab3f3;margin-top:1px">был(а) недавно</div>
    </div>
    <div class="header-right">
      <button class="icon-btn" onclick="toast('Скоро')">☎</button>
      <button class="icon-btn" onclick="openChatMenu()">⋮</button>
    </div>
  </div>
  <div id="messages"></div>
  <div class="input-area">
    <div class="input-wrap">
      <button class="input-btn" onclick="toast('Скоро')">☺</button>
      <textarea id="msgInput" placeholder="Сообщение" rows="1" oninput="autoResize(this)" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMsg()}"></textarea>
      <button class="input-btn" onclick="toast('Скоро')">⚏</button>
    </div>
    <button class="send-btn" onclick="sendMsg()">➤</button>
  </div>
</div>

<div class="screen" id="profileScreen">
  <div class="header">
    <div class="header-left"><button class="back-btn" onclick="closeProfile()">←</button></div>
    <h1>Профиль</h1>
    <div class="header-right">
      <button class="icon-btn" onclick="openProfileMenu()">⋮</button>
    </div>
  </div>
  <div class="content" id="profileContent"></div>
</div>

<div class="modal" id="editModal">
  <div class="header" style="background:#17212b">
    <div class="header-left"><button class="back-btn" onclick="closeModal('editModal')">←</button></div>
    <h1>Аккаунт</h1>
    <div class="header-right">
      <button class="icon-btn" onclick="saveProfile()" style="color:#6ab3f3;font-weight:600;font-size:15px;width:auto;padding:0 12px">Сохранить</button>
    </div>
  </div>
  <div class="content" style="background:#0e1621;padding-bottom:20px">
    <div style="padding:24px 16px;text-align:center;background:#17212b">
      <div style="position:relative;display:inline-block">
        <div class="avatar lg" id="avatarPreview" style="margin:0 auto;cursor:pointer" onclick="pickFromGallery()">?</div>
        <div style="position:absolute;bottom:0;right:0;width:36px;height:36px;border-radius:50%;background:#6ab3f3;color:#fff;display:flex;align-items:center;justify-content:center;font-size:17px;border:3px solid #17212b;cursor:pointer" onclick="pickFromGallery()">◉</div>
      </div>
      <div style="margin-top:12px;color:#6ab3f3;font-size:14px;cursor:pointer" onclick="pickFromGallery()">Изменить фото</div>
    </div>
    <div style="padding:14px 16px;background:#17212b;margin-top:12px;border-radius:12px;margin-left:8px;margin-right:8px">
      <div style="color:#6ab3f3;font-size:13px;margin-bottom:6px">Ваше имя</div>
      <input id="ep_name" placeholder="Имя" maxlength="30" style="width:100%;padding:10px 0;border:none;background:transparent;color:#fff;font-size:17px;outline:none">
      <div style="border-top:1px solid #0e1621;margin:8px 0"></div>
      <input id="ep_lastname" placeholder="Фамилия" maxlength="30" style="width:100%;padding:10px 0;border:none;background:transparent;color:#fff;font-size:17px;outline:none">
    </div>
    <div style="padding:14px 16px;background:#17212b;margin-top:12px;border-radius:12px;margin-left:8px;margin-right:8px">
      <div style="color:#6ab3f3;font-size:13px;margin-bottom:6px">О себе</div>
      <input id="ep_bio" placeholder="Напишите немного о себе" maxlength="70" style="width:100%;padding:10px 0;border:none;background:transparent;color:#fff;font-size:17px;outline:none">
    </div>
    <div style="padding:14px 16px;background:#17212b;margin-top:12px;border-radius:12px;margin-left:8px;margin-right:8px">
      <div style="color:#6ab3f3;font-size:13px;margin-bottom:12px">Информация о Вас</div>
      <div id="unamesEditList"></div>
      <div style="margin-top:12px;color:#6ab3f3;font-size:15px;font-weight:500;cursor:pointer" onclick="openAddUsername()">+ Добавить username</div>
    </div>
  </div>
</div>

<div class="modal" id="searchModal">
  <div class="header" style="background:#17212b">
    <div class="header-left"><button class="back-btn" onclick="closeModal('searchModal')">←</button></div>
    <h1>Найти пользователя</h1>
    <div class="header-right"></div>
  </div>
  <div class="content" style="background:#0e1621">
    <div style="padding:12px 16px">
      <input id="searchInput" placeholder="username" autocomplete="off" oninput="doSearch(this.value)" style="width:100%;padding:12px 14px;border-radius:20px;background:#17212b;color:#fff;border:none;font-size:15px;outline:none">
    </div>
    <div id="searchResults"></div>
  </div>
</div>

<input type="file" id="avatarGallery" class="file-input" accept="image/*" onchange="pickAvatar(event)">
<div class="ctx-backdrop" id="ctxBackdrop" onclick="closeCtx()"></div>
<div class="ctx-menu" id="ctxMenu"></div>
<div class="toast" id="toastEl"></div>

<script>
const WS_URL = location.origin.replace("https://", "wss://").replace("http://", "ws://") + "/ws";

let ws = null;
let me = null, meName = null;
let currentChat = null, currentProfileUser = null;
let users = [], currentTab = 'chats', chats = {}, avatarCache = {};

function connect() {
  ws = new WebSocket(WS_URL);
  ws.onmessage = e => handle(JSON.parse(e.data));
  ws.onerror = () => err("Ошибка соединения");
  ws.onclose = () => err("Отключено");
}
function send(o) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(o)); }
function err(m) { const e = document.getElementById("err"); if (e) e.innerText = m; }
function doLogin() {
  const u = document.getElementById("u").value.trim().toLowerCase();
  const p = document.getElementById("p").value;
  if (!u || !p) return err("Заполни всё");
  send({cmd:"login", username:u, password:p});
}
function doRegister() {
  const u = document.getElementById("u").value.trim().toLowerCase();
  const p = document.getElementById("p").value;
  if (!u || !p) return err("Заполни всё");
  send({cmd:"register", username:u, password:p});
}

function handle(d) {
  if (d.type === "registered" || d.type === "logged_in") {
    me = d.user_id; meName = me;
    showScreen("mainScreen");
    send({cmd:"users"});
    send({cmd:"profile", user:me});
    switchTab("chats");
  }
  else if (d.type === "users") {
    users = d.list || [];
    if (currentTab === "users") renderUsers();
    if (currentTab === "chats") renderChats();
    if (currentTab === "gifts") renderGiftsShop();
  }
  else if (d.type === "search_results") renderSearchResults(d.list || []);
  else if (d.type === "contact_added") { toast("@"+d.user+" добавлен"); closeModal("searchModal"); send({cmd:"users"}); }
  else if (d.type === "history") renderHistory(d.msgs);
  else if (d.type === "msg") {
    const c = document.getElementById("messages");
    addMessage(c, d.from, d.text, d.ts, false);
    c.scrollTop = c.scrollHeight;
    chats[d.from] = {text:d.text, ts:d.ts, unread:(chats[d.from]?.unread||0)+1};
  }
  else if (d.type === "sent") {
    const c = document.getElementById("messages");
    addMessage(c, me, d.text, d.ts, true, d.delivered);
    c.scrollTop = c.scrollHeight;
    chats[d.to] = {text:d.text, ts:d.ts, unread:0};
  }
  else if (d.type === "profile") {
    window._lastProfile = d;
    if (d.user === me) meName = d.first_name;
    if (d.avatar) loadAvatar(d.avatar);
    if (document.getElementById("profileScreen").classList.contains("active")) renderProfile(d);
    if (currentTab === "settings") renderSettings(d);
  }
  else if (d.type === "avatar_data") {
    if (d.data) { avatarCache[d.file] = d.data; refreshAvatars(); }
  }
  else if (d.type === "profile_updated") { send({cmd:"profile", user:me}); send({cmd:"users"}); }
  else if (d.type === "username_added") { toast("@"+d.username+" добавлен"); if (currentProfileUser) send({cmd:"profile", user:currentProfileUser}); }
  else if (d.type === "username_deleted") { toast("@"+d.username+" удалён"); if (currentProfileUser) send({cmd:"profile", user:currentProfileUser}); }
  else if (d.type === "primary_updated") { toast("Основной: @"+d.username); send({cmd:"users"}); if (currentProfileUser) send({cmd:"profile", user:currentProfileUser}); }
  else if (d.type === "gift_received") toast(d.from+" подарил "+d.name+" "+d.stars+"★");
  else if (d.type === "gift_sent") toast("Подарок отправлен @"+d.to);
  else if (d.type === "chat_deleted") { delete chats[d.with]; toast("Чат очищен"); }
  else if (d.type === "error") { err(d.msg); if (me) toast("Ошибка: "+d.msg); }
}

function loadAvatar(f) { if (!f || avatarCache[f]) return; send({cmd:"get_avatar", file:f}); }
function showScreen(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll(".nav-item").forEach(t => t.classList.toggle("active", t.dataset.tab === tab));
  document.getElementById("screenTitle").innerText = {chats:"Чаты", users:"Контакты", gifts:"Подарки", settings:"Настройки"}[tab];
  if (tab === "chats") renderChats();
  else if (tab === "users") { send({cmd:"users"}); renderUsers(); }
  else if (tab === "gifts") renderGiftsShop();
  else if (tab === "settings") { renderSettings(window._lastProfile); send({cmd:"profile", user:me}); }
}
function renderChats() {
  const c = document.getElementById("mainContent");
  const keys = Object.keys(chats);
  if (!keys.length) { c.innerHTML = '<div class="empty">Нет диалогов<br><br>Открой <b>Контакты</b> и выбери кого-то</div>'; return; }
  c.innerHTML = "";
  for (const u of keys) { const ch = chats[u]; c.appendChild(userItem(u, ch.text, ch.ts, ch.unread)); }
}
function renderUsers() {
  const c = document.getElementById("mainContent");
  c.innerHTML = `
    <div style="padding:8px 12px;background:#17212b">
      <input id="userSearchInput" placeholder="Поиск юзера..." oninput="filterUsers(this.value)" autocomplete="off" style="width:100%;padding:10px 14px;border-radius:20px;background:#0e1621;color:#fff;border:none;font-size:15px;outline:none">
    </div>
    <div class="list-item" style="border-bottom:1px solid #17212b" onclick="openSearchModal()">
      <div class="avatar" style="background:#5288c1;font-size:28px">+</div>
      <div class="info" style="border:none">
        <div class="name" style="color:#6ab3f3">Добавить пользователя</div>
        <div class="sub">найти по @username</div>
      </div>

    <div id="usersList"></div>`;
  filterUsers("");
}
function filterUsers(q) {
  const wrap = document.getElementById("usersList");
  if (!wrap) return;
  q = (q||"").toLowerCase().trim();
  const list = users.filter(x => x.u !== me && (!q || x.u.includes(q) || (x.n||'').toLowerCase().includes(q)));
  if (!list.length) { wrap.innerHTML = '<div class="empty">Никого не найдено</div>'; return; }
  wrap.innerHTML = "";
  for (const x of list) {
    const el = document.createElement("div");
    el.className = "list-item";
    el.onclick = () => openChat(x.u);
    el.innerHTML = `${avatarHtml(x.u, x.av)}<div class="info"><div class="name">${escapeHtml(x.n||x.u)}</div><div class="sub">@${escapeHtml(x.u)}</div></div>`;
    wrap.appendChild(el);
    if (x.av) loadAvatar(x.av);
  }
}
function avatarHtml(u, av) {
  const cached = av && avatarCache[av];
  const style = cached ? `background-image:url('${cached}');color:transparent` : '';
  return `<div class="avatar" style="${style}">${cached?'':initials(u)}</div>`;
}
function refreshAvatars() {
  if (currentTab === "users") { const q = document.getElementById("userSearchInput")?.value || ""; filterUsers(q); }

function userItem(u, sub, ts, unread) {

}

function openChat(u) {

  if (av && avatarCache[av]) { avEl.style.backgroundImage = `url('${avatarCache[av]}')`; avEl.style.color = "transparent"; avEl.innerText = ""; }
  else { avEl.style.backgroundImage = ""; avEl.innerText = initials(u); if (av) loadAvatar(av); }

function closeChat() { currentChat = null; showScreen("mainScreen"); switchTab(currentTab); }
function sendMsg() {
  const inp = document.getElementById("msgInput");
  const text = inp.value.trim();
  if (!text || !currentChat) return;
  send({cmd:"send", to:currentChat, text:text});
  inp.value = ""; inp.style.height = "auto";
}
function addMessage(container, from, text, ts, isMe, delivered) {
  const wrap = document.createElement("div");
  wrap.className = "msg-wrap " + (isMe ? "me" : "them");
  const time = (ts||"").substring(11,16);
  let checks = "";
  if (isMe) { const mark = delivered ? "✓✓" : "✓"; const color = delivered ? "#6ab3f3" : "#708499"; checks = `<span class="checks" style="color:${color}">${mark}</span>`; }
  wrap.innerHTML = `<div class="msg ${isMe?'me':'them'}"><div class="txt">${escapeHtml(text)}</div><div class="meta"><span>${time}</span>${checks}</div></div>`;

function renderHistory(msgs) {
  const c = document.getElementById("messages");

function autoResize(el) { el.style.height = "auto"; el.style.height = Math.min(el.scrollHeight, 120) + "px"; }
function openMyProfile() { openProfile(me); }

}

function renderProfile(d) {

  }

        ${isMe ? '<div class="camera" onclick="openEditProfile()">◉</div>' : ''}
      </div>
      <div class="pname">${escapeHtml(d.first_name || d.user)}<span class="v">✓</span></div>
      <div class="pstatus">${isMe ? 'в сети' : 'был(а) недавно'}</div>
      <div class="profile-actions">
        <div class="act" onclick="${isMe ? 'openEditProfile()' : `closeProfile();openChat('${d.user}')`}">
          <div class="ai">${isMe?'✎':'✉'}</div><div class="at">${isMe?'Изменить':'Написать'}</div>
        </div>
        <div class="act" onclick="toast('Скоро')"><div class="ai">◉</div><div class="at">Фото</div></div>
        <div class="act" onclick="toast('Скоро')"><div class="ai">↗</div><div class="at">Поделиться</div></div>
      </div>
    </div>

    <div class="info-card"><div class="usernames">${unamesHtml}<div class="hint">Нажми на юзернейм: копировать / сделать основным / удалить</div></div></div>
    ${giftsHtml}`;
}
function openAddUsername() {
  const name = prompt("Новый username (без @):");
  if (!name) return;
  const clean = name.trim().toLowerCase().replace("@","");
  if (clean.length < 4) { toast("Минимум 4 символа"); return; }
  if (!/^[a-z0-9_]+$/.test(clean)) { toast("Только буквы, цифры, _"); return; }
  send({cmd:"add_username", username:clean});
}
function openUsernameMenu(u, isPrimary) {
  const isMine = currentProfileUser === me;
  const items = [{icon:"⧉", label:"Скопировать", action:`copyUsername('${u}')`}];
  if (isMine && !isPrimary) {
    items.push({icon:"★", label:"Сделать основным", action:`send({cmd:'set_primary_username', username:'${u}'})`});
    items.push({icon:"✕", label:"Удалить", danger:true, action:`send({cmd:'delete_username', username:'${u}'})`});
  }

}
function copyUsername(u) {
  const t = "@"+u;
  if (navigator.clipboard) navigator.clipboard.writeText(t).then(() => toast("Скопировано: "+t));
  else toast(t);
}

  const isMe = currentProfileUser === me;
  if (isMe) showCtx([{icon:"⏻", label:"Выйти с аккаунта", danger:true, action:"logout()"}]);
  else showCtx([{icon:"✉", label:"Написать", action:`closeProfile();openChat('${currentProfileUser}')`}]);
}
function openChatMenu() {

function showCtx(items) {

  document.getElementById("ctxBackdrop").classList.remove("active");
}
const GIFTS = [
  {emoji:"🎁", name:"Подарок", stars:15},{emoji:"🌹", name:"Роза", stars:25},
  {emoji:"🧸", name:"Мишка", stars:50},{emoji:"💎", name:"Алмаз", stars:100},
  {emoji:"🏆", name:"Кубок", stars:200},{emoji:"🚀", name:"Ракета", stars:500},
  {emoji:"👑", name:"Корона", stars:1000},{emoji:"💍", name:"Кольцо", stars:2000},
  {emoji:"🐉", name:"Дракон", stars:5000}
];
function renderGiftsShop() {

function renderSettings(p) {
  const c = document.getElementById("mainContent");
  const prof = p || window._lastProfile || {};
  const first = prof.first_name || meName || me;
  const avFile = prof.avatar || "";
  const avData = avFile ? avatarCache[avFile] : "";

function logout() {
  if (!confirm("Выйти?")) return;

}
function pickFromGallery() { document.getElementById("avatarGallery").click(); }
function pickAvatar(event) {
  const file = event.target.files[0];
  if (!file) return;
  if (file.size > 5 * 1024 * 1024) { toast("Файл больше 5 МБ"); return; }
  const reader = new FileReader();
  reader.onload = e => {
    const dataUrl = e.target.result;
    const img = new Image();
    img.onload = () => {
      try {
        const canvas = document.createElement("canvas");
        const maxSize = 512;
        let w = img.width, h = img.height;
        if (w > h) { h = Math.round(h * maxSize / w); w = maxSize; }
        else { w = Math.round(w * maxSize / h); h = maxSize; }
        canvas.width = w; canvas.height = h;
        canvas.getContext("2d").drawImage(img, 0, 0, w, h);
        saveAvatarImmediately(canvas.toDataURL("image/jpeg", 0.85));
      } catch (err) { saveAvatarImmediately(dataUrl); }
    };
    img.onerror = () => saveAvatarImmediately(dataUrl);
    img.src = dataUrl;
  };
  reader.readAsDataURL(file);
  event.target.value = "";
}
function saveAvatarImmediately(compressed) {
  const preview = document.getElementById("avatarPreview");
  if (preview) {
    preview.style.backgroundImage = "url('" + compressed + "')";
    preview.style.color = "transparent";
    preview.innerText = "";
  }
  send({cmd:"update_profile", avatar_data: compressed});
  toast("Фото сохраняется...");
}
function saveProfile() {
  const name = document.getElementById("ep_name").value.trim();
  const bio = document.getElementById("ep_bio").value.trim();
  send({cmd:"update_profile", first_name:name, bio:bio});
  closeModal("editModal");
  toast("Профиль сохранён");
  setTimeout(() => { send({cmd:"profile", user:me}); send({cmd:"users"}); }, 500);
}
function closeModal(id) { document.getElementById(id).classList.remove("active"); }
function initials(name) { if (!name) return "?"; return name.slice(0, 2).toUpperCase(); }
function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c])); }
let toastTimer;
function toast(msg) {
  const t = document.getElementById("toastEl");
  t.innerText = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2000);
}
